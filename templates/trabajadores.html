{% extends "layout.html" %}

{% block title %}Trabajadores{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 70vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-trabajadores {
        --sticky-col1-w: 5.75rem;
        --sticky-col2-w: 14rem;
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-trabajadores th,
    .table-trabajadores td {
        padding: 0.25rem 0.45rem;
        vertical-align: middle;
    }

    .table-trabajadores thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-trabajadores .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 1;
        background-color: #fff;
        min-width: var(--sticky-col1-w);
        width: var(--sticky-col1-w);
        max-width: var(--sticky-col1-w);
        box-sizing: border-box;
    }

    .table-trabajadores .sticky-col-2 {
        position: sticky;
        left: var(--sticky-col1-w);
        z-index: 1;
        background-color: #fff;
        min-width: var(--sticky-col2-w);
        max-width: var(--sticky-col2-w);
        box-sizing: border-box;
    }

    .table-trabajadores thead th.sticky-col-1,
    .table-trabajadores thead th.sticky-col-2 {
        z-index: 3;
        background-color: #f8f9fa;
    }

    .table-trabajadores tbody tr.fila-seleccionada > td {
        background-color: #cfe2ff !important;
    }

    .table-trabajadores tbody tr.fila-seleccionada > td.sticky-col-1,
    .table-trabajadores tbody tr.fila-seleccionada > td.sticky-col-2 {
        background-color: #cfe2ff !important;
    }

    .table-trabajadores tbody tr {
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body pt-3">
        <form id="frmTrabajadores" class="row g-3" action="#" method="post" onsubmit="return false;">
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted">Tipo planilla <span class="fw-normal opacity-75">(opcional)</span></label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" disabled>
                    <option value="0">Todos</option>
                </select>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <label for="cboTrabajador" class="form-label small fw-bold text-muted">Trabajador <span class="fw-normal opacity-75">(opcional)</span></label>
                <select id="cboTrabajador" class="form-select form-select-sm" disabled>
                    <option value="0">Todos (por defecto)</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="txtDni" class="form-label small fw-bold text-muted">DNI / documento</label>
                <input type="text" id="txtDni" class="form-control form-control-sm" placeholder="Número de documento" maxlength="20" autocomplete="off">
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="txtNombre" class="form-label small fw-bold text-muted">Nombre</label>
                <input type="text" id="txtNombre" class="form-control form-control-sm" placeholder="Buscar por nombre" maxlength="100" autocomplete="off">
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboEstado" class="form-label small fw-bold text-muted">Estado</label>
                <select id="cboEstado" class="form-select form-select-sm" required>
                    <option value="T">Todos</option>
                    <option value="A" selected>Activo</option>
                    <option value="I">Inactivo</option>
                </select>
            </div>
            <div class="col-6 col-sm-4 col-md-3 col-lg-1">
                <label for="cboCesados" class="form-label small fw-bold text-muted">Cesados</label>
                <select id="cboCesados" class="form-select form-select-sm">
                    <option value="T" selected>Todos</option>
                    <option value="Y">Sí</option>
                    <option value="N">No</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboBancoHaberes" class="form-label small fw-bold text-muted">Banco haberes <span class="fw-normal opacity-75">(opcional)</span></label>
                <select id="cboBancoHaberes" class="form-select form-select-sm" disabled>
                    <option value="0" selected>Todos</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboUnidad" class="form-label small fw-bold text-muted">Unidad</label>
                <select id="cboUnidad" class="form-select form-select-sm">
                    <option value="0">Todas</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="button" class="btn btn-primary btn-sm px-4" id="btnConsultarTrabajadores" disabled>
                    <i class="bi bi-search"></i> Consultar
                </button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnNuevoTrabajador" disabled>
                    <i class="bi bi-person-plus"></i> Nuevo
                </button>
                <button type="button" class="btn btn-warning btn-sm px-4" id="btnReingresoTrabajador" disabled title="Seleccione un trabajador cesado en el listado">
                    <i class="bi bi-arrow-repeat"></i> Reingreso
                </button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcelTrab" disabled><i class="bi bi-file-earmark-excel"></i> Exportar a Excel</button>
                <span class="ms-auto text-muted small fw-bold">No. de Registros: <span id="lblRowCountTrab">0</span></span>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoTrabajadores">
    <div class="card-body">
        <h4 class="text-center fw-bold mb-3">LISTADO DE TRABAJADORES</h4>
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-trabajadores align-middle">
                <thead id="thead-trabajadores"></thead>
                <tbody id="tbody-trabajadores"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const frmTrabajadores = document.getElementById('frmTrabajadores');
    const btnConsultarTrab = document.getElementById('btnConsultarTrabajadores');
    const btnNuevoTrab = document.getElementById('btnNuevoTrabajador');
    const btnReingresoTrab = document.getElementById('btnReingresoTrabajador');
    let consultaHabilitada = false;
    let trabajadorSeleccionado = null;

    function setBotonesConsultaEnabled(enabled) {
        if (btnConsultarTrab) btnConsultarTrab.disabled = !enabled;
        if (btnNuevoTrab) btnNuevoTrab.disabled = !enabled;
        actualizarBotonReingreso();
    }

    function actualizarBotonReingreso() {
        if (!btnReingresoTrab) return;
        const ok = consultaHabilitada
            && trabajadorSeleccionado
            && trabajadorSeleccionado.person
            && trabajadorSeleccionado.cesado;
        btnReingresoTrab.disabled = !ok;
        btnReingresoTrab.title = ok
            ? ('Registrar reingreso de ' + (trabajadorSeleccionado.nombre || trabajadorSeleccionado.person))
            : 'Seleccione un trabajador cesado en el listado';
    }

    function seleccionarFilaTrabajador(tr) {
        const tbody = document.getElementById('tbody-trabajadores');
        if (!tbody || !tr) return;
        tbody.querySelectorAll('tr.fila-seleccionada').forEach((row) => {
            row.classList.remove('fila-seleccionada');
        });
        tr.classList.add('fila-seleccionada');
        trabajadorSeleccionado = {
            person: String(tr.getAttribute('data-person') || '').trim(),
            nombre: String(tr.getAttribute('data-nombre') || '').trim(),
            cesado: String(tr.getAttribute('data-cesado') || '') === '1',
        };
        actualizarBotonReingreso();
    }

    if (frmTrabajadores) {
        frmTrabajadores.addEventListener('submit', function (e) {
            e.preventDefault();
        });
    }

    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.trabajadores
        ? window.FiltrosPlanillasReportes.trabajadores()
        : null;

    const URL_LISTADO = {{ url_for('api_trabajadores_listado') | tojson }};
    const URL_ELIMINAR = {{ url_for('api_trabajadores_eliminar') | tojson }};
    const IDX_STICKY_1 = 1;
    const IDX_STICKY_2 = 2;
    const IDX_CENTRO = new Set([6, 7]);

    let lastExportTrab = null;

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    async function hmConfirmar(opciones) {
        if (window.HmUi) return HmUi.confirmar(opciones);
        return confirm(opciones.mensaje || opciones.message || '¿Continuar?');
    }

    function hmError(mensaje) {
        if (window.HmUi) HmUi.error(mensaje);
        else alert(mensaje);
    }

    function hmExito(mensaje) {
        if (window.HmUi) HmUi.exito(mensaje);
        else alert(mensaje);
    }

    function hmAdvertencia(mensaje) {
        if (window.HmUi && typeof HmUi.advertencia === 'function') HmUi.advertencia(mensaje);
        else alert(mensaje);
    }

    function etiquetaCompaniaSeleccionada() {
        const cbo = document.getElementById('cboCompania');
        if (!cbo || !cbo.value) return '';
        const opt = cbo.options[cbo.selectedIndex];
        return opt ? String(opt.textContent || '').trim() : '';
    }

    function optionExists(select, value) {
        if (!select || value === '' || value == null) return false;
        const v = String(value).trim();
        return Array.from(select.options).some((o) => String(o.value).trim() === v);
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value) === v);
        if (!ok) select.value = '';
    }

    function selectedText(id) {
        const el = document.getElementById(id);
        const opt = el && el.options[el.selectedIndex];
        return opt ? opt.textContent.trim() : '';
    }

    async function cargarUnidades() {
        const cboUnidad = document.getElementById('cboUnidad');
        if (!cboUnidad) return;
        const prev = String(cboUnidad.value || '0').trim();
        cboUnidad.innerHTML = '';
        const optAll = document.createElement('option');
        optAll.value = '0';
        optAll.textContent = 'Todas';
        cboUnidad.appendChild(optAll);
        try {
            const res = await fetch('/api/selectores/unidades');
            const data = await res.json();
            (Array.isArray(data) ? data : []).forEach((item) => {
                const id = item.id != null ? String(item.id).trim() : '';
                if (!id || id === '0') return;
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = item.text != null ? String(item.text) : id;
                cboUnidad.appendChild(opt);
            });
            const ok = Array.from(cboUnidad.options).some((o) => String(o.value).trim() === prev);
            cboUnidad.value = ok ? prev : '0';
        } catch (e) {
            console.error(e);
            cboUnidad.value = '0';
        }
    }

    function renderizarTablaTrabajadores(response) {
        const thead = document.getElementById('thead-trabajadores');
        const tbody = document.getElementById('tbody-trabajadores');
        const headers = response.headers || [];
        const rowsMeta = Array.isArray(response.rows) ? response.rows : [];
        const ciaActual = document.getElementById('cboCompania').value.trim();
        const idxAcciones = headers.length - 1;

        let htmlHeaders = '<tr>';
        headers.forEach((header, index) => {
            let sticky = '';
            if (index === IDX_STICKY_1) sticky = 'sticky-col-1';
            else if (index === IDX_STICKY_2) sticky = 'sticky-col-2';
            const cen = IDX_CENTRO.has(index) ? ' text-center' : '';
            htmlHeaders += `<th class="${sticky}${cen}">${escapeHtml(header)}</th>`;
        });
        htmlHeaders += '</tr>';
        thead.innerHTML = htmlHeaders;

        const filas = response.data || [];
        let htmlBody = '';
        trabajadorSeleccionado = null;
        filas.forEach((rowVals, rowIndex) => {
            const meta = rowsMeta[rowIndex] || {};
            const person = String(meta.person || '').trim();
            const nombre = String(meta.nombre || '').trim();
            const cesado = !!meta.cesado || !!String(meta.fechacese || '').trim();
            htmlBody += `<tr data-person="${escapeHtml(person)}" data-nombre="${escapeHtml(nombre)}" data-cesado="${cesado ? '1' : '0'}">`;
            (rowVals || []).forEach((valor, index) => {
                if (index === idxAcciones) {
                    const editUrl = person
                        ? `/trabajadores/editar/${encodeURIComponent(person)}?cia=${encodeURIComponent(ciaActual)}`
                        : '#';
                    const btnEdit = person
                        ? `<a href="${editUrl}" class="text-decoration-none btn-editar-trabajador" title="Editar trabajador"><i class="bi bi-pencil-fill text-success"></i></a>`
                        : '';
                    const btnDel = person
                        ? `<button type="button" class="btn btn-link btn-sm p-0 ms-2 btn-eliminar-trabajador" title="Eliminar de la empresa" data-person="${escapeHtml(person)}" data-nombre="${escapeHtml(nombre)}"><i class="bi bi-trash-fill text-danger"></i></button>`
                        : '';
                    const btn = (btnEdit || btnDel)
                        ? `${btnEdit}${btnDel}`
                        : '<span class="text-muted">—</span>';
                    htmlBody += `<td class="text-center">${btn}</td>`;
                    return;
                }
                let sticky = '';
                if (index === IDX_STICKY_1) sticky = 'sticky-col-1 font-monospace fw-bold';
                else if (index === IDX_STICKY_2) sticky = 'sticky-col-2 text-truncate';
                const align = IDX_CENTRO.has(index) ? 'text-center' : '';
                htmlBody += `<td class="${[sticky, align].filter(Boolean).join(' ')}">${escapeHtml(valor)}</td>`;
            });
            htmlBody += '</tr>';
        });

        tbody.innerHTML = htmlBody;
        document.getElementById('lblRowCountTrab').textContent = String(filas.length);
        actualizarBotonReingreso();
    }

    async function exportTrabajadoresExcel(payload, meta) {
        if (typeof ExcelJS === 'undefined') {
            alert('No se pudo cargar la librería de Excel (ExcelJS). Recargue la página e intente de nuevo.');
            return;
        }
        const headers = payload.headers || [];
        const filas = payload.data || [];
        const ncols = headers.length;
        if (!ncols) return;
        const exportHeaders = headers.slice(0, -1);
        const exportFilas = filas.map((row) => (row || []).slice(0, -1));
        const exportCols = exportHeaders.length;

        const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
        const allBorders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Trabajadores', { views: [{ showGridLines: true }] });

        let rowIdx = 1;
        ws.mergeCells(rowIdx, 1, rowIdx, exportCols);
        const titleCell = ws.getCell(rowIdx, 1);
        titleCell.value = 'LISTADO DE TRABAJADORES';
        titleCell.font = { bold: true, size: 14 };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        titleCell.fill = fill('FFE9ECEF');
        titleCell.border = allBorders;
        rowIdx++;

        const metaRow = ws.addRow([
            'Compañía', meta.compania || '',
            'Tipo planilla', meta.tipoPlanilla || '',
            'Trabajador', meta.trabajador || '',
            'DNI', meta.dni || '',
            'Estado', meta.estado || '',
            'Banco haberes', meta.bancoHaberes || '',
            'Unidad', meta.unidad || ''
        ]);
        metaRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            if (colNumber <= 14) {
                cell.fill = fill('FFF8F9FA');
                cell.font = { bold: colNumber % 2 === 1 };
            }
            cell.border = allBorders;
        });
        rowIdx++;

        ws.addRow([]);
        rowIdx++;

        const hRow = ws.addRow(exportHeaders);
        hRow.font = { bold: true };
        hRow.eachCell({ includeEmpty: true }, (cell) => {
            cell.fill = fill('FFF8F9FA');
            cell.border = allBorders;
        });

        exportFilas.forEach((rowVals) => {
            const r = ws.addRow(rowVals || []);
            r.eachCell({ includeEmpty: true }, (cell) => {
                cell.border = allBorders;
            });
        });

        ws.getColumn(1).width = 16;
        ws.getColumn(2).width = 10;
        ws.getColumn(3).width = 34;
        for (let c = 4; c <= exportCols; c++) {
            ws.getColumn(c).width = 14;
        }

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safe = (s) => String(s || 'export').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80);
        const stamp = new Date().toISOString().slice(0, 10);
        a.download = `trabajadores_${safe(meta.compania)}_${stamp}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    async function ejecutarConsultaTrabajadores() {
        lastExportTrab = null;
        document.getElementById('btnExportExcelTrab').disabled = true;
        setBotonesConsultaEnabled(false);
        if (filtrosPersist) filtrosPersist.guardar();

        const cia = document.getElementById('cboCompania').value.trim();
        let payrolltype = document.getElementById('cboTipoPlanilla').value.trim();
        if (!payrolltype) payrolltype = '0';
        let person = document.getElementById('cboTrabajador').value.trim();
        if (!person) person = '0';
        const docnro = document.getElementById('txtDni').value.trim();
        const nombre = document.getElementById('txtNombre').value.trim();
        const estado = document.getElementById('cboEstado').value.trim() || 'A';
        const cesados = document.getElementById('cboCesados').value.trim() || 'T';
        let salarybank = document.getElementById('cboBancoHaberes').value.trim();
        if (!salarybank) salarybank = '0';
        const repunit = String(document.getElementById('cboUnidad')?.value || '0').trim() || '0';

        if (!cia) {
            alert('Seleccione una compañía.');
            if (consultaHabilitada) setBotonesConsultaEnabled(true);
            return;
        }

        try {
            const res = await fetch(URL_LISTADO, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cia, payrolltype, person, docnro, nombre, estado, cesados, salarybank,
                    repunit
                })
            });
            const payload = await res.json();
            if (!res.ok || payload.error) {
                document.getElementById('cardResultadoTrabajadores').classList.add('d-none');
                document.getElementById('lblRowCountTrab').textContent = '0';
                alert(payload.error || 'Error al consultar trabajadores.');
                return;
            }
            if (!Array.isArray(payload.headers) || !Array.isArray(payload.data)) {
                alert('Respuesta inválida del servidor.');
                document.getElementById('cardResultadoTrabajadores').classList.add('d-none');
                document.getElementById('lblRowCountTrab').textContent = '0';
                return;
            }
            document.getElementById('cardResultadoTrabajadores').classList.remove('d-none');
            renderizarTablaTrabajadores(payload);
            lastExportTrab = {
                headers: payload.headers,
                data: payload.data,
                meta: {
                    compania: selectedText('cboCompania'),
                    tipoPlanilla: payrolltype === '0' ? 'Todos' : selectedText('cboTipoPlanilla'),
                    trabajador: person === '0' ? 'Todos' : selectedText('cboTrabajador'),
                    dni: docnro || '—',
                    nombre: nombre || '—',
                    estado: selectedText('cboEstado'),
                    bancoHaberes: salarybank === '0' ? 'Todos' : selectedText('cboBancoHaberes'),
                    unidad: selectedText('cboUnidad')
                }
            };
            document.getElementById('btnExportExcelTrab').disabled = false;
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoTrabajadores').classList.add('d-none');
            document.getElementById('btnExportExcelTrab').disabled = true;
            document.getElementById('lblRowCountTrab').textContent = '0';
            alert('Error de red o del servidor.');
        } finally {
            if (consultaHabilitada) setBotonesConsultaEnabled(true);
        }
    }

    const poblarSelect = async (url, selectElement, opciones) => {
        opciones = opciones || {};
        const valorTodos = opciones.valorTodos != null ? String(opciones.valorTodos) : '';
        const textoTodos = opciones.textoTodos || 'Todos';
        const incluyeTodos = !!opciones.incluyeTodos;

        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const res = await fetch(url);
            const data = await res.json();
            selectElement.innerHTML = '';
            if (incluyeTodos) {
                const optTodos = document.createElement('option');
                optTodos.value = valorTodos;
                optTodos.textContent = textoTodos;
                selectElement.appendChild(optTodos);
            } else {
                const def = document.createElement('option');
                def.value = '';
                def.textContent = 'Seleccione...';
                selectElement.appendChild(def);
            }
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                selectElement.appendChild(opt);
            });
            selectElement.disabled = false;
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="">Error</option>';
        }
    };

    async function poblarBancosHaberes(cia) {
        const cboBanco = document.getElementById('cboBancoHaberes');
        if (!cboBanco) return;
        if (!cia) {
            cboBanco.innerHTML = '<option value="0" selected>Todos</option>';
            cboBanco.disabled = true;
            return;
        }
        await poblarSelect(
            `/api/selectores/bancos?cia=${encodeURIComponent(cia)}`,
            cboBanco,
            { incluyeTodos: true, valorTodos: '0', textoTodos: 'Todos' }
        );
    }

    async function poblarDependientesCompania(cia) {
        if (!cia) return;
        await poblarSelect(
            `/api/selectores/planillas?cia=${encodeURIComponent(cia)}`,
            cboPlanilla,
            { incluyeTodos: true, valorTodos: '0', textoTodos: 'Todos' }
        );
        await poblarSelect(
            `/api/selectores/trabajadores?cia=${encodeURIComponent(cia)}`,
            cboTrabajador,
            { incluyeTodos: true, valorTodos: '0', textoTodos: 'Todos (por defecto)' }
        );
        await poblarBancosHaberes(cia);
    }

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPlanilla = document.getElementById('cboTipoPlanilla');
    const cboTrabajador = document.getElementById('cboTrabajador');
    const txtDni = document.getElementById('txtDni');
    const txtNombre = document.getElementById('txtNombre');
    const paramsUrl = new URLSearchParams(window.location.search);
    const esRetornoListado = paramsUrl.get('retorno') === '1';

    await poblarSelect('/api/selectores/companias', cboCia);
    limpiarValorComboSiObsoleto(cboCia);
    await cargarUnidades();

    const guardadoObj = filtrosPersist ? filtrosPersist.leer() : null;
    const ciaGuardada = guardadoObj ? String(guardadoObj.cia || '').trim() : '';
    let filtrosRestaurados = false;

    if (filtrosPersist && ciaGuardada) {
        filtrosRestaurados = await filtrosPersist.aplicarRestauracionCascada({ poblarSelect, poblarBancosHaberes, cargarUnidades });
    }

    limpiarValorComboSiObsoleto(cboCia);
    if (!filtrosRestaurados && !String(cboCia.value || '').trim()) {
        if (seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA)) {
            await poblarDependientesCompania(cboCia.value.trim());
        }
    } else if (!filtrosRestaurados) {
        const ciaInicial = cboCia.value.trim();
        if (ciaInicial) {
            await poblarDependientesCompania(ciaInicial);
        }
    }

    {
        const cia = cboCia.value.trim();
        if (cia) {
            await ejecutarConsultaTrabajadores();
        }
    }

    consultaHabilitada = true;
    setBotonesConsultaEnabled(true);

    if (esRetornoListado) {
        history.replaceState({}, '', window.location.pathname);
    }

    document.getElementById('cboCompania').addEventListener('change', async function () {
        const cia = this.value;
        const cboPlanillaEl = document.getElementById('cboTipoPlanilla');
        const cboTrabajadorEl = document.getElementById('cboTrabajador');
        const cboBancoEl = document.getElementById('cboBancoHaberes');

        if (cia) {
            await poblarDependientesCompania(cia);
        } else {
            cboPlanillaEl.innerHTML = '<option value="0">Todos</option>';
            cboPlanillaEl.disabled = true;
            cboTrabajadorEl.innerHTML = '<option value="0">Todos (por defecto)</option>';
            cboTrabajadorEl.disabled = true;
            await poblarBancosHaberes('');
        }
    });

    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
        txtDni.addEventListener('input', function () {
            filtrosPersist.guardar();
        });
        txtNombre.addEventListener('input', function () {
            filtrosPersist.guardar();
        });
    }

    document.getElementById('tbody-trabajadores').addEventListener('click', async function (ev) {
        const link = ev.target.closest('a[href*="/trabajadores/editar/"]');
        if (link && filtrosPersist) {
            filtrosPersist.guardar();
        }

        const btnDel = ev.target.closest('.btn-eliminar-trabajador');
        if (btnDel) {
            ev.preventDefault();
            ev.stopPropagation();
            const person = String(btnDel.getAttribute('data-person') || '').trim();
            const nombre = String(btnDel.getAttribute('data-nombre') || '').trim();
            const cia = document.getElementById('cboCompania').value.trim();
            const ciaTxt = etiquetaCompaniaSeleccionada() || cia;
            if (!person || !cia) {
                hmError('Seleccione compañía y trabajador.');
                return;
            }

            const ok = await hmConfirmar({
                titulo: 'Eliminar trabajador',
                mensaje:
                    `Se eliminará completamente el registro del trabajador${nombre ? ` "${nombre}"` : ''} ` +
                    `de la empresa "${ciaTxt}".\n\nEsta acción no se podrá revertir.`,
                textoOk: 'Eliminar',
                textoCancelar: 'Cancelar',
                variant: 'danger',
            });
            if (!ok) return;

            btnDel.disabled = true;
            try {
                const res = await fetch(URL_ELIMINAR, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cia, person }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'No se pudo eliminar el trabajador.');
                hmExito(data.mensaje || 'Trabajador eliminado.');
                await ejecutarConsultaTrabajadores();
            } catch (err) {
                console.error(err);
                hmError(err.message || String(err));
            } finally {
                btnDel.disabled = false;
            }
            return;
        }

        if (ev.target.closest('a, button')) return;
        const tr = ev.target.closest('tr');
        if (tr && tr.parentElement && tr.parentElement.id === 'tbody-trabajadores') {
            seleccionarFilaTrabajador(tr);
        }
    });

    if (btnConsultarTrab) {
        btnConsultarTrab.addEventListener('click', async function () {
            if (!consultaHabilitada) return;
            await ejecutarConsultaTrabajadores();
        });
    }

    if (btnNuevoTrab) {
        btnNuevoTrab.addEventListener('click', function () {
            if (!consultaHabilitada) return;
            const cia = document.getElementById('cboCompania').value.trim();
            if (!cia) {
                alert('Seleccione una compañía.');
                return;
            }
            if (filtrosPersist) filtrosPersist.guardar();
            window.location.href = '/trabajadores/nuevo?cia=' + encodeURIComponent(cia);
        });
    }

    if (btnReingresoTrab) {
        btnReingresoTrab.addEventListener('click', function () {
            if (!consultaHabilitada) return;
            const cia = document.getElementById('cboCompania').value.trim();
            if (!cia) {
                alert('Seleccione una compañía.');
                return;
            }
            if (!trabajadorSeleccionado || !trabajadorSeleccionado.person) {
                hmAdvertencia('Seleccione en el listado el trabajador cesado a reingresar.');
                return;
            }
            if (!trabajadorSeleccionado.cesado) {
                hmAdvertencia('Solo se puede reingresar un trabajador con fecha de cese.');
                return;
            }
            if (filtrosPersist) filtrosPersist.guardar();
            const person = trabajadorSeleccionado.person;
            window.location.href =
                '/trabajadores/editar/' + encodeURIComponent(person) +
                '?cia=' + encodeURIComponent(cia) +
                '&seccion=laborales&modo=reingreso';
        });
    }

    document.getElementById('btnExportExcelTrab').addEventListener('click', async function () {
        if (!lastExportTrab || !lastExportTrab.headers || !lastExportTrab.headers.length) {
            alert('Ejecute primero una búsqueda con resultados.');
            return;
        }
        try {
            await exportTrabajadoresExcel(
                { headers: lastExportTrab.headers, data: lastExportTrab.data },
                lastExportTrab.meta
            );
        } catch (err) {
            console.error(err);
            alert('No se pudo generar el archivo Excel.');
        }
    });
});
</script>
{% endblock %}
