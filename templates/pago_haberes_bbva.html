{% extends "layout.html" %}

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2 small">
                <li class="breadcrumb-item text-muted">Pago de Haberes</li>
                <li class="breadcrumb-item active" aria-current="page">Archivo BBVA</li>
            </ol>

        <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-bank"></i> Archivo BBVA</h5>
