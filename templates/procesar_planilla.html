{% extends "layout.html" %}

{% block title %}Procesar planilla{% endblock %}

{% block extra_css %}
<style>
    /* Mismas reglas que Planilla vertical (listado denso) */
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-planilla-vertical {
        --sticky-col1-w: 5.75rem;
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-planilla-vertical th,
    .table-planilla-vertical td {
        padding: 0.2rem 0.4rem;
        vertical-align: middle;
    }

    .table-planilla-vertical thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-planilla-vertical .form-check-input {
        width: 0.75rem;
        height: 0.75rem;
        margin: 0;
        vertical-align: middle;
    }

    /* Fila de filtros: periodo legible aunque la columna sea estrecha */
    #txtPeriodoDesc {
        min-width: 0;
    }

    #cboCesados {
        max-width: 100%;
    }

    .procesar-filtro-compania {
        flex: 0 0 100%;
        max-width: 100%;
    }

    @media (min-width: 768px) {
        .procesar-filtro-compania {
            flex: 0 0 28%;
            max-width: 28%;
        }
    }

    @media (min-width: 992px) {
        .procesar-filtro-compania {
            flex: 0 0 22%;
            max-width: 22%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body pt-3">
        <form id="frmProcesarPlanilla" class="row g-3">
            <div class="col-12 col-md-6 col-lg-4 procesar-filtro-compania">
                <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted">Tipo planilla</label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboProcesoCalculo" class="form-label small fw-bold text-muted">Proceso</label>
                <select id="cboProcesoCalculo" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="txtPeriodoDesc" class="form-label small fw-bold text-muted">Periodo</label>
                <input type="text" id="txtPeriodoDesc" class="form-control form-control-sm text-truncate" readonly autocomplete="off" placeholder="—" title="">
                <input type="hidden" id="hidPeriodoCalculo" value="">
            </div>
            <div class="col-6 col-sm-4 col-md-3 col-lg-1">
                <label for="cboCesados" class="form-label small fw-bold text-muted">Cesados</label>
                <select id="cboCesados" class="form-select form-select-sm">
                    <option value="T" selected>Todos</option>
                    <option value="Y">Sí</option>
                    <option value="N">No</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboUnidad" class="form-label small fw-bold text-muted">Unidad</label>
                <select id="cboUnidad" class="form-select form-select-sm">
                    <option value="0">Todas</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-1">
                <button type="submit" class="btn btn-primary btn-sm px-4" id="btnConsultarPlanilla">
                    <i class="bi bi-search"></i> Consultar
                </button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnCalcular" disabled>
                    <i class="bi bi-calculator"></i> Calcular planilla
                </button>
                <span class="ms-auto text-muted small fw-bold">
                    Registros: <span id="lblRowCountPlanilla">0</span>
                    · Seleccionados: <span id="lblSeleccionadosPlanilla">0</span>
                </span>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-body pt-3">
        <div id="container-progreso" class="mb-3 d-none" aria-live="polite">
            <div class="d-flex justify-content-between mb-1">
                <span id="progreso-label" class="small fw-bold text-muted">Procesando trabajadores…</span>
                <span id="progreso-porcentaje" class="small fw-bold text-muted">0%</span>
            </div>
            <div class="progress" style="height: 20px;">
                <div
                    id="barra-progreso"
                    class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    role="progressbar"
                    style="width: 0%;"
                    aria-valuenow="0"
                    aria-valuemin="0"
                    aria-valuemax="100"
                ></div>
            </div>
            <div id="progreso-detalle-error" class="small text-danger mt-2 d-none"></div>
        </div>

        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-planilla-vertical align-middle">
                <thead>
                    <tr>
                        <th style="width: 2.5rem;" class="text-center">
                            <input type="checkbox" id="checkAll" class="form-check-input" title="Marcar / desmarcar todos">
                        </th>
                        <th style="width: 7rem;">Código</th>
                        <th>Nombre del trabajador</th>
                        <th style="width: 7rem;">F. ingreso</th>
                        <th style="width: 7rem;">F. cese</th>
                    </tr>
                </thead>
                <tbody id="tbodyTrabajadores"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.procesarPlanilla
        ? window.FiltrosPlanillasReportes.procesarPlanilla()
        : null;

    const URL_PROCESOS = {{ url_for('api_procesar_planilla_procesos') | tojson }};
    const URL_PERIODOS = {{ url_for('api_procesar_planilla_periodos_list') | tojson }};
    const URL_UNIDADES = {{ url_for('api_unidades') | tojson }};
    const URL_TRABAJADORES = {{ url_for('api_procesar_planilla_trabajadores') | tojson }};
    const URL_EJECUTAR_STREAMING = {{ url_for('ejecutar_calculo_streaming') | tojson }};

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPt = document.getElementById('cboTipoPlanilla');
    const cboProc = document.getElementById('cboProcesoCalculo');
    const cboCesados = document.getElementById('cboCesados');
    const cboUnidad = document.getElementById('cboUnidad');

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value).trim() === v);
        if (!ok) select.value = '';
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarTablaTrabajadores() {
        document.getElementById('tbodyTrabajadores').innerHTML = '';
        const chk = document.getElementById('checkAll');
        chk.checked = false;
        chk.indeterminate = false;
        actualizarContadores();
    }

    function actualizarContadores() {
        const total = document.querySelectorAll('.check-trabajador').length;
        const sel = document.querySelectorAll('.check-trabajador:checked').length;
        document.getElementById('lblRowCountPlanilla').textContent = String(total);
        document.getElementById('lblSeleccionadosPlanilla').textContent = String(sel);
        document.getElementById('btnCalcular').disabled = sel === 0;
    }

    function sincronizarCheckAll() {
        const all = document.querySelectorAll('.check-trabajador');
        const chk = document.getElementById('checkAll');
        if (!chk) return;
        if (!all.length) {
            chk.checked = false;
            chk.indeterminate = false;
            return;
        }
        let c = 0;
        all.forEach((x) => { if (x.checked) c++; });
        chk.checked = c === all.length;
        chk.indeterminate = c > 0 && c < all.length;
    }

    function toggleAll(source) {
        document.querySelectorAll('.check-trabajador').forEach((x) => { x.checked = source.checked; });
        actualizarContadores();
        if (filtrosPersist) filtrosPersist.guardar();
    }

    document.getElementById('checkAll').addEventListener('change', function () {
        toggleAll(this);
    });

    const poblarSelect = async (url, selectElement) => {
        if (!selectElement) return;
        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const res = await fetch(url);
            const data = await res.json();
            selectElement.innerHTML = '';
            const def = document.createElement('option');
            def.value = '';
            def.textContent = 'Seleccione...';
            selectElement.appendChild(def);
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                selectElement.appendChild(opt);
            });
            selectElement.disabled = false;
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="">Error</option>';
        }
    };

    async function cargarUnidades() {
        if (!cboUnidad) return;
        const prev = String(cboUnidad.value || '0').trim();
        cboUnidad.innerHTML = '';
        const optAll = document.createElement('option');
        optAll.value = '0';
        optAll.textContent = 'Todas';
        cboUnidad.appendChild(optAll);
        try {
            const res = await fetch(URL_UNIDADES);
            const data = await res.json();
            (Array.isArray(data) ? data : []).forEach((item) => {
                const id = item.id != null ? String(item.id).trim() : '';
                if (!id || id === '0') return;
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = item.text != null ? String(item.text) : id;
                cboUnidad.appendChild(opt);
            });
            const ok = Array.from(cboUnidad.options).some((o) => String(o.value).trim() === prev);
            cboUnidad.value = ok ? prev : '0';
        } catch (e) {
            console.error(e);
            cboUnidad.value = '0';
        }
    }

    async function cargarProcesos() {
        const cia = cboCia.value.trim();
        const pt = cboPt.value.trim();
        cboProc.innerHTML = '<option value="">Seleccione...</option>';
        document.getElementById('hidPeriodoCalculo').value = '';
        const txtPerReset = document.getElementById('txtPeriodoDesc');
        txtPerReset.value = '';
        txtPerReset.title = '';
        limpiarTablaTrabajadores();
        if (!cia || !pt) {
            cboProc.disabled = true;
            return;
        }
        cboProc.disabled = false;
        try {
            const res = await fetch(URL_PROCESOS, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, payrolltype: pt })
            });
            const data = await res.json();
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                opt.dataset.procedureName = item.procedurename != null ? String(item.procedurename).trim() : '';
                cboProc.appendChild(opt);
            });
        } catch (e) {
            console.error(e);
            cboProc.innerHTML = '<option value="">Error</option>';
        }
    }

    async function cargarPeriodo(periodoPreferido) {
        const cia = cboCia.value.trim();
        const proc = cboProc.value.trim();
        const hid = document.getElementById('hidPeriodoCalculo');
        const txt = document.getElementById('txtPeriodoDesc');
        hid.value = '';
        txt.value = '';
        txt.title = '';
        if (!cia || !proc) return;
        try {
            const res = await fetch(
                `${URL_PERIODOS}?cia=${encodeURIComponent(cia)}&processtype=${encodeURIComponent(proc)}`
            );
            const data = await res.json();
            const arr = Array.isArray(data) ? data : [];
            let pick = arr[0] || null;
            if (periodoPreferido) {
                const want = String(periodoPreferido).trim();
                const found = arr.find((p) => String(p.id).trim() === want);
                if (found) pick = found;
            }
            if (pick) {
                hid.value = String(pick.id || '');
                txt.value = String(pick.text || '');
                txt.title = String(pick.text || pick.id || '').trim();
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function listarTrabajadores(opciones) {
        opciones = opciones || {};
        const restoreIds = opciones.seleccionPersonas;
        const cia = cboCia.value.trim();
        const payrolltype = cboPt.value.trim();
        const period = document.getElementById('hidPeriodoCalculo').value.trim();
        const cesados = String(cboCesados.value || 'T').trim().toUpperCase();
        const repunit = String(cboUnidad.value || '0').trim() || '0';
        if (!cia || !payrolltype || !period) {
            alert('Seleccione compañía, tipo de planilla, proceso y periodo (válido) antes de listar.');
            return;
        }
        const tbody = document.getElementById('tbodyTrabajadores');
        tbody.innerHTML = '';
        document.getElementById('checkAll').checked = false;
        document.getElementById('checkAll').indeterminate = false;
        try {
            const res = await fetch(URL_TRABAJADORES, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, payrolltype, period, cesados, repunit })
            });
            const data = await res.json();
            if (!res.ok) {
                alert(data.error || 'Error al listar trabajadores.');
                return;
            }
            if (!Array.isArray(data)) {
                alert('Respuesta inválida del servidor.');
                return;
            }
            const want = restoreIds && Array.isArray(restoreIds) ? new Set(restoreIds.map((x) => String(x).trim())) : null;
            data.forEach((t) => {
                const tr = document.createElement('tr');
                const td0 = document.createElement('td');
                td0.className = 'text-center';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'check-trabajador form-check-input';
                const pid = String(t.person || '').trim();
                cb.value = pid;
                if (want && want.has(pid)) cb.checked = true;
                td0.appendChild(cb);
                const td1 = document.createElement('td');
                td1.className = 'font-monospace';
                td1.textContent = pid;
                const td2 = document.createElement('td');
                td2.textContent = String(t.name || '').trim();
                const td3 = document.createElement('td');
                td3.textContent = String(t.entrydate || '').trim();
                const td4 = document.createElement('td');
                td4.textContent = String(t.ceasedate || '').trim();
                tr.appendChild(td0);
                tr.appendChild(td1);
                tr.appendChild(td2);
                tr.appendChild(td3);
                tr.appendChild(td4);
                tbody.appendChild(tr);
            });
            sincronizarCheckAll();
            actualizarContadores();
            if (filtrosPersist) filtrosPersist.guardar();
        } catch (e) {
            console.error(e);
            alert('Error de red o del servidor.');
        }
    }

    function setUiCalculoEnCurso(enCurso) {
        const ids = [
            'cboCompania',
            'cboTipoPlanilla',
            'cboProcesoCalculo',
            'cboCesados',
            'cboUnidad',
            'txtPeriodoDesc',
            'btnConsultarPlanilla',
            'checkAll'
        ];
        ids.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.disabled = enCurso;
        });
        document.querySelectorAll('.check-trabajador').forEach((cb) => {
            cb.disabled = enCurso;
        });
    }

    function resetBarraProgreso() {
        const barra = document.getElementById('barra-progreso');
        const pct = document.getElementById('progreso-porcentaje');
        const label = document.getElementById('progreso-label');
        const err = document.getElementById('progreso-detalle-error');
        if (barra) {
            barra.style.width = '0%';
            barra.setAttribute('aria-valuenow', '0');
        }
        if (pct) pct.textContent = '0%';
        if (label) label.textContent = 'Procesando trabajadores…';
        if (err) {
            err.textContent = '';
            err.classList.add('d-none');
        }
    }

    function esperarRepintadoUI() {
        return new Promise((resolve) => {
            if (typeof window.requestAnimationFrame === 'function') {
                window.requestAnimationFrame(() => resolve());
            } else {
                setTimeout(resolve, 0);
            }
        });
    }

    function esperar(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function actualizarBarraProgreso(barra, porcentajeTxt, label, actual, total, detalleErr, detalle) {
        const p = Math.min(100, Math.max(0, Math.round((actual / total) * 100)));
        const ps = p + '%';
        barra.style.width = ps;
        barra.setAttribute('aria-valuenow', String(p));
        porcentajeTxt.textContent = ps;
        label.textContent = `Procesando: ${actual} de ${total}`;
        if (detalleErr && detalle) {
            detalleErr.textContent = String(detalle);
            detalleErr.classList.remove('d-none');
        }
    }

    async function consumirEventosCalculoStreaming(response, ui) {
        if (!response.body || typeof response.body.getReader !== 'function') {
            throw new Error('El navegador no soporta progreso en streaming.');
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let resultadoFinal = null;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            let sep = buffer.indexOf('\n\n');
            while (sep !== -1) {
                const bloque = buffer.slice(0, sep);
                buffer = buffer.slice(sep + 2);
                const linea = bloque.split('\n').find((l) => l.startsWith('data: '));
                if (linea) {
                    let data = null;
                    try {
                        data = JSON.parse(linea.slice(6));
                    } catch (parseErr) {
                        console.warn('Evento SSE inválido', parseErr);
                    }
                    if (data) {
                        if (data.error) {
                            throw new Error(data.error);
                        }
                        if (data.done) {
                            resultadoFinal = data;
                        } else if (typeof data.actual === 'number' && typeof data.total === 'number' && data.total > 0) {
                            actualizarBarraProgreso(
                                ui.barra,
                                ui.porcentajeTxt,
                                ui.label,
                                data.actual,
                                data.total,
                                ui.detalleErr,
                                data.detalle
                            );
                            await esperarRepintadoUI();
                        }
                    }
                }
                sep = buffer.indexOf('\n\n');
            }
        }
        return resultadoFinal;
    }

    async function iniciarCalculo() {
        const checks = document.querySelectorAll('.check-trabajador:checked');
        const listaPerson = Array.from(checks)
            .map((c) => String(c.value).trim())
            .filter(Boolean);
        if (!listaPerson.length) {
            alert('Seleccione al menos un trabajador.');
            return;
        }
        const cia = cboCia.value.trim();
        const payroll_type = cboPt.value.trim();
        const processtype = cboProc.value.trim();
        const period = document.getElementById('hidPeriodoCalculo').value.trim();
        if (!cia || !payroll_type || !processtype || !period) {
            alert('Complete compañía, tipo de planilla, proceso y periodo antes de calcular.');
            return;
        }

        const optProceso = cboProc.options[cboProc.selectedIndex];
        const procedureName = optProceso
            ? String(optProceso.dataset.procedureName || '').trim()
            : '';
        if (!procedureName) {
            const descProceso = optProceso
                ? String(optProceso.textContent || '').trim()
                : processtype;
            alert(
                `El proceso "${descProceso}" no tiene un procedimiento de cálculo configurado (ProcedureName).`
            );
            return;
        }

        const container = document.getElementById('container-progreso');
        const barra = document.getElementById('barra-progreso');
        const label = document.getElementById('progreso-label');
        const porcentajeTxt = document.getElementById('progreso-porcentaje');
        const detalleErr = document.getElementById('progreso-detalle-error');
        const btn = document.getElementById('btnCalcular');

        resetBarraProgreso();
        container.classList.remove('d-none');
        btn.disabled = true;
        setUiCalculoEnCurso(true);

        try {
            const response = await fetch(URL_EJECUTAR_STREAMING, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cia: cia,
                    processtype: processtype,
                    payroll_type: payroll_type,
                    period: period,
                    trabajadores: listaPerson
                })
            });

            if (!response.ok) {
                let errMsg = 'No se pudo iniciar el cálculo de planilla.';
                try {
                    const errJson = await response.json();
                    if (errJson && errJson.error) errMsg = errJson.error;
                } catch (ignore) {}
                alert(errMsg);
                return;
            }

            const resultado = await consumirEventosCalculoStreaming(response, {
                barra,
                label,
                porcentajeTxt,
                detalleErr
            });

            actualizarBarraProgreso(
                barra,
                porcentajeTxt,
                label,
                listaPerson.length,
                listaPerson.length,
                detalleErr,
                null
            );
            await esperarRepintadoUI();
            await esperarRepintadoUI();
            await esperar(120);

            const totalExitos = Number(resultado && resultado.exitos != null ? resultado.exitos : 0);
            const totalErrores = Number(resultado && resultado.errores != null ? resultado.errores : 0);
            const detallesTotales = resultado && Array.isArray(resultado.detalles) ? resultado.detalles : [];

            let msg = `Cálculo finalizado. Éxitos: ${totalExitos}, errores: ${totalErrores}.`;
            if (detallesTotales.length) {
                msg += '\n\n' + detallesTotales.slice(0, 10).join('\n');
                if (detallesTotales.length > 10) msg += '\n…';
            }
            alert(msg);
        } catch (error) {
            console.error(error);
            alert(error && error.message ? error.message : 'Ocurrió un error en la comunicación con el servidor.');
        } finally {
            container.classList.add('d-none');
            resetBarraProgreso();
            setUiCalculoEnCurso(false);
            actualizarContadores();
        }
    }

    document.getElementById('frmProcesarPlanilla').addEventListener('submit', function (e) {
        e.preventDefault();
        listarTrabajadores();
    });
    document.getElementById('btnCalcular').addEventListener('click', function () {
        iniciarCalculo();
    });

    document.getElementById('tbodyTrabajadores').addEventListener('change', function (e) {
        const t = e.target;
        if (t && t.classList && t.classList.contains('check-trabajador')) {
            sincronizarCheckAll();
            actualizarContadores();
            if (filtrosPersist) filtrosPersist.guardar();
        }
    });

    await poblarSelect('/api/selectores/companias', cboCia);
    limpiarValorComboSiObsoleto(cboCia);
    await cargarUnidades();

    const guardado = filtrosPersist ? filtrosPersist.leer() : null;
    const optEx = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.optionExistsTrim;

    let restaurado = false;
    if (guardado && guardado.cia && optEx && optEx(cboCia, guardado.cia)) {
        cboCia.value = String(guardado.cia).trim();
        await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cboCia.value.trim())}`, cboPt);
        const payroll = guardado.payroll != null ? String(guardado.payroll).trim() : '';
        if (payroll && optEx(cboPt, payroll)) {
            cboPt.value = payroll;
            await cargarProcesos();
            const proceso = guardado.proceso != null ? String(guardado.proceso).trim() : '';
            if (proceso && optEx(cboProc, proceso)) {
                cboProc.value = proceso;
                const ces = guardado.cesados != null ? String(guardado.cesados).trim().toUpperCase() : '';
                if (ces && ['T', 'Y', 'N'].includes(ces) && cboCesados) {
                    cboCesados.value = ces;
                }
                const ru = guardado.repunit != null ? String(guardado.repunit).trim() : '';
                if (ru !== '' && cboUnidad && optEx && optEx(cboUnidad, ru)) {
                    cboUnidad.value = ru;
                }
                const perSaved = guardado.periodo != null ? String(guardado.periodo).trim() : '';
                await cargarPeriodo(perSaved || undefined);
                const hid = document.getElementById('hidPeriodoCalculo').value.trim();
                if (hid) {
                    await listarTrabajadores({ seleccionPersonas: guardado.seleccionPersonas || [] });
                    restaurado = true;
                }
            }
        }
    }

    if (!restaurado && !String(cboCia.value || '').trim()) {
        if (seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA)) {
            await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cboCia.value.trim())}`, cboPt);
        }
    }

    limpiarValorComboSiObsoleto(cboCia);
    limpiarValorComboSiObsoleto(cboPt);

    document.getElementById('cboCompania').addEventListener('change', async function () {
        const cia = this.value.trim();
        cboProc.innerHTML = '<option value="">Seleccione...</option>';
        cboProc.disabled = true;
        document.getElementById('hidPeriodoCalculo').value = '';
        const txtP = document.getElementById('txtPeriodoDesc');
        txtP.value = '';
        txtP.title = '';
        limpiarTablaTrabajadores();
        if (cia) {
            await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cia)}`, cboPt);
        } else {
            cboPt.innerHTML = '<option value="">Seleccione...</option>';
            cboPt.disabled = true;
        }
        if (filtrosPersist) filtrosPersist.guardar();
    });

    document.getElementById('cboTipoPlanilla').addEventListener('change', async function () {
        document.getElementById('hidPeriodoCalculo').value = '';
        const txtTP = document.getElementById('txtPeriodoDesc');
        txtTP.value = '';
        txtTP.title = '';
        limpiarTablaTrabajadores();
        await cargarProcesos();
        if (filtrosPersist) filtrosPersist.guardar();
    });

    document.getElementById('cboProcesoCalculo').addEventListener('change', async function () {
        document.getElementById('hidPeriodoCalculo').value = '';
        const txtPR = document.getElementById('txtPeriodoDesc');
        txtPR.value = '';
        txtPR.title = '';
        limpiarTablaTrabajadores();
        await cargarPeriodo();
        if (filtrosPersist) filtrosPersist.guardar();
    });

    document.getElementById('cboCesados').addEventListener('change', function () {
        limpiarTablaTrabajadores();
        if (filtrosPersist) filtrosPersist.guardar();
    });

    document.getElementById('cboUnidad').addEventListener('change', function () {
        limpiarTablaTrabajadores();
        if (filtrosPersist) filtrosPersist.guardar();
    });

    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
    }
});
</script>
{% endblock %}
