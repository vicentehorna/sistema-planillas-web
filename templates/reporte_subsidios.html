{% extends "layout.html" %}

{% block title %}Reporte de Subsidios{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 70vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }
    .table-subsidios {
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }
    .table-subsidios th,
    .table-subsidios td {
        padding: 0.28rem 0.45rem;
        vertical-align: middle;
    }
    .table-subsidios thead th {
        position: sticky;
        top: 0;
        background-color: #1e3a5f;
        color: #fff;
        z-index: 2;
        box-shadow: 0 1px 0 #0d2137;
        text-align: center;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
    }
    .table-subsidios thead th.col-mes {
        text-align: left;
        background-color: #1e3a5f;
        min-width: 7.5rem;
    }
    .table-subsidios .col-concepto {
        min-width: 5.5rem;
        text-align: right;
    }
    .table-subsidios .col-mes {
        min-width: 7.5rem;
        text-align: left;
        font-weight: 600;
    }
    .table-subsidios tfoot td {
        font-weight: 700;
        background-color: #f1f3f5;
    }
    .table-subsidios tfoot td.col-subtotal-label {
        text-align: left;
    }
    .table-subsidios tfoot td.total-ingresos {
        background-color: #cfe2ff;
        text-align: right;
    }
    .table-subsidios tfoot td.total-ingresos-label {
        background-color: #cfe2ff;
        text-align: left;
    }
    .table-subsidios tfoot td.kpi-label {
        text-align: left;
        background-color: #fff;
        font-weight: 700;
    }
    .table-subsidios tfoot td.kpi-value {
        text-align: right;
        background-color: #fff;
        font-weight: 700;
    }
    .titulo-reporte {
        font-size: 1.05rem;
        text-align: center;
        margin: 0;
    }
    .subtitulo-trabajador {
        font-size: 0.85rem;
        text-align: center;
        color: #555;
        margin: 0.15rem 0 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-2">
    <div class="card-body py-3">
        <form id="frmSubsidios" class="row g-2 align-items-end">
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboCompania" class="form-label small fw-bold text-muted mb-1">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted mb-1">Planilla</label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboProceso" class="form-label small fw-bold text-muted mb-1">Proceso</label>
                <select id="cboProceso" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboPeriodo" class="form-label small fw-bold text-muted mb-1">Periodo</label>
                <select id="cboPeriodo" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <label for="cboTrabajador" class="form-label small fw-bold text-muted mb-1">Trabajador</label>
                <select id="cboTrabajador" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-2 mt-1">
                <button type="submit" class="btn btn-primary btn-sm px-4" id="btnConsultar">
                    <i class="bi bi-search"></i> Consultar
                </button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcel" disabled>
                    <i class="bi bi-file-earmark-excel"></i> Exportar a Excel
                </button>
                <span class="ms-auto text-muted small fw-bold">
                    Conceptos: <span id="lblColCount">0</span>
                    · Meses: <span id="lblRowCount">0</span>
                </span>
            </div>
        </form>
        <div id="msgEstado" class="small mt-2 text-muted"></div>
    </div>
</div>

<div class="card shadow-sm border-0">
    <div class="card-body py-2">
        <div class="mb-2">
            <div class="titulo-reporte fw-bold" id="lblTituloReporte">Reporte de Subsidios</div>
            <div class="subtitulo-trabajador" id="lblTrabajador"></div>
        </div>
        <div class="table-scroll-container" id="wrapTabla">
            <table class="table table-bordered table-sm table-hover table-subsidios align-middle">
                <thead>
                    <tr id="theadSubsidios">
                        <th class="col-mes">Mes</th>
                    </tr>
                </thead>
                <tbody id="tbodySubsidios">
                    <tr>
                        <td class="text-center text-muted py-4">Sin datos</td>
                    </tr>
                </tbody>
                <tfoot id="tfootSubsidios"></tfoot>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="{{ url_for('static', filename='js/combos_carga.js') }}"></script>
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const URL_API = {{ url_for('api_reporte_subsidios') | tojson }};
    const STORAGE_KEY = 'filtros_reporte_subsidios';
    const DEFAULT_CIA = 'BGT';

    const cboCia = document.getElementById('cboCompania');
    const cboPlanilla = document.getElementById('cboTipoPlanilla');
    const cboProceso = document.getElementById('cboProceso');
    const cboPeriodo = document.getElementById('cboPeriodo');
    const cboTrabajador = document.getElementById('cboTrabajador');
    const thead = document.getElementById('theadSubsidios');
    const tbody = document.getElementById('tbodySubsidios');
    const tfoot = document.getElementById('tfootSubsidios');
    const lblCount = document.getElementById('lblRowCount');
    const lblColCount = document.getElementById('lblColCount');
    const lblTitulo = document.getElementById('lblTituloReporte');
    const lblTrabajador = document.getElementById('lblTrabajador');
    const msg = document.getElementById('msgEstado');
    const btnExcel = document.getElementById('btnExportExcel');
    const poblarSelect = CombosCarga.poblarSelect;

    let ultimoPayload = null;

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function fmtNum(n) {
        const v = Number(n || 0);
        if (!Number.isFinite(v)) return '0.00';
        return v.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function selectedText(el) {
        const opt = el && el.options[el.selectedIndex];
        return opt ? opt.textContent.trim() : '';
    }
    function optionExists(select, value) {
        if (!select || value == null) return false;
        const v = String(value);
        return Array.from(select.options).some((o) => o.value === v);
    }
    function reseleccionar(select, pref) {
        if (!pref) return false;
        if (pref.texto) return CombosCarga.seleccionarPorTexto(select, pref.texto);
        if (pref.valor && optionExists(select, pref.valor)) {
            select.value = pref.valor;
            return true;
        }
        return false;
    }
    function guardarFiltros() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                cia: cboCia.value,
                payrolltype: cboPlanilla.value,
                process: cboProceso.value,
                period: cboPeriodo.value,
                person: cboTrabajador.value,
            }));
        } catch (e) { /* ignore */ }
    }
    function leerFiltros() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
        catch (e) { return {}; }
    }

    function renderVacio(mensaje) {
        thead.innerHTML = '<th class="col-mes">Mes</th>';
        tbody.innerHTML = `<tr><td class="text-center text-muted py-4">${esc(mensaje || 'Sin datos')}</td></tr>`;
        tfoot.innerHTML = '';
        lblCount.textContent = '0';
        lblColCount.textContent = '0';
        btnExcel.disabled = true;
    }

    function renderMatriz(data) {
        const columns = data.columns || [];
        const rows = data.rows || [];
        const subtots = data.subtotals || {};
        const totalIngresos = Number(data.total_ingresos || 0);
        const meses = Number(data.meses || 0);
        const promedio = Number(data.promedio || 0);

        if (!columns.length) {
            renderVacio('Sin conceptos afectos a AFP con importe en los 12 meses');
            lblTrabajador.textContent = [data.person, data.personname].filter(Boolean).join(' — ');
            return;
        }

        let head = '<th class="col-mes">Mes</th>';
        columns.forEach((c) => {
            head += `<th class="col-concepto" title="${esc(c.concept)}">${esc(c.description)}</th>`;
        });
        thead.innerHTML = head;

        let body = '';
        rows.forEach((r) => {
            body += `<tr><td class="col-mes">${esc(r.month_lbl)}</td>`;
            columns.forEach((c) => {
                const v = (r.values && r.values[c.concept] != null) ? r.values[c.concept] : 0;
                body += `<td class="col-concepto">${fmtNum(v)}</td>`;
            });
            body += '</tr>';
        });
        tbody.innerHTML = body || `<tr><td colspan="${columns.length + 1}" class="text-center text-muted py-4">Sin datos</td></tr>`;

        let foot = '<tr><td class="col-subtotal-label">SUBTOTAL</td>';
        columns.forEach((c) => {
            foot += `<td class="col-concepto">${fmtNum(subtots[c.concept] || 0)}</td>`;
        });
        foot += '</tr>';
        const restoCols = Math.max(0, columns.length - 1);
        const kpiRow = (label, value, labelCls, valueCls) => `<tr>
            <td class="${labelCls}">${label}</td>
            <td class="${valueCls}">${fmtNum(value)}</td>
            ${restoCols ? `<td colspan="${restoCols}" class="${labelCls}"></td>` : ''}
        </tr>`;
        foot += kpiRow('TOTAL INGRESOS', totalIngresos, 'total-ingresos-label', 'total-ingresos');
        foot += kpiRow('MESES', meses, 'kpi-label', 'kpi-value');
        foot += kpiRow('PROMEDIO', promedio, 'kpi-label', 'kpi-value');
        tfoot.innerHTML = foot;

        lblCount.textContent = String(rows.length);
        lblColCount.textContent = String(columns.length);
        lblTrabajador.textContent = [data.person, data.personname].filter(Boolean).join(' — ');
        btnExcel.disabled = !rows.length;
    }

    function actualizarTitulo() {
        const p = selectedText(cboPeriodo);
        let s = 'Reporte de Subsidios — conceptos afectos AFP';
        if (p) s += ` · Periodo ${p}`;
        lblTitulo.textContent = s;
    }

    async function cargarProcesos(cia, payrolltype, procesoPreferido) {
        if (!cia || !payrolltype) {
            CombosCarga.resetSelect(cboProceso);
            CombosCarga.resetSelect(cboPeriodo);
            return false;
        }
        const ok = await poblarSelect(
            `/api/selectores/procesos?cia=${encodeURIComponent(cia)}&payrolltype=${encodeURIComponent(payrolltype)}`,
            cboProceso,
            { textoVacio: 'Sin procesos' }
        );
        if (ok) reseleccionar(cboProceso, procesoPreferido);
        return ok;
    }

    async function cargarPeriodos(cia, payrolltype, processtype, periodoPreferido) {
        if (!cia || !payrolltype || !processtype) {
            CombosCarga.resetSelect(cboPeriodo);
            return false;
        }
        return FiltrosPlanillasReportes.poblarPeriodosConActivo(
            cia, payrolltype, processtype, cboPeriodo, poblarSelect, periodoPreferido || ''
        );
    }

    async function cargarTrabajadores(cia, personPreferido) {
        if (!cia) {
            CombosCarga.resetSelect(cboTrabajador, 'Seleccione...');
            return false;
        }
        const ok = await poblarSelect(
            `/api/selectores/trabajadores?cia=${encodeURIComponent(cia)}`,
            cboTrabajador,
            { textoVacio: 'Seleccione trabajador...' }
        );
        if (ok) reseleccionar(cboTrabajador, personPreferido);
        return ok;
    }

    let generacionCompania = 0;
    async function cargarDependientesCia(cia, pref) {
        const gen = ++generacionCompania;
        pref = pref || {};
        CombosCarga.resetSelect(cboProceso);
        CombosCarga.resetSelect(cboPeriodo);
        if (!cia) {
            CombosCarga.resetSelect(cboPlanilla);
            CombosCarga.resetSelect(cboTrabajador, 'Seleccione...');
            return false;
        }
        const q = encodeURIComponent(cia);
        const [okPlanilla] = await Promise.all([
            poblarSelect(`/api/selectores/planillas?cia=${q}`, cboPlanilla, { textoVacio: 'Sin planillas' }),
            cargarTrabajadores(cia, pref.trabajador),
        ]);
        if (gen !== generacionCompania || !okPlanilla) return false;
        reseleccionar(cboPlanilla, pref.planilla);
        const pt = CombosCarga.valorValido(cboPlanilla);
        const okProc = await cargarProcesos(cia, pt, pref.proceso);
        if (gen !== generacionCompania || !okProc) return false;
        await cargarPeriodos(cia, pt, CombosCarga.valorValido(cboProceso), pref.period || '');
        return true;
    }

    async function consultar(ev) {
        if (ev) ev.preventDefault();
        const cia = CombosCarga.valorValido(cboCia);
        const payrolltype = CombosCarga.valorValido(cboPlanilla);
        const process = CombosCarga.valorValido(cboProceso);
        const period = CombosCarga.valorValido(cboPeriodo);
        const person = CombosCarga.valorValido(cboTrabajador);
        if (!cia || !payrolltype || !process || !period || !person) {
            msg.textContent = 'Complete compañía, planilla, proceso, periodo y trabajador.';
            msg.className = 'small mt-2 text-danger';
            return;
        }
        msg.textContent = 'Consultando...';
        msg.className = 'small mt-2 text-muted';
        guardarFiltros();
        actualizarTitulo();
        try {
            const res = await fetch(URL_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, payrolltype, process, period, person }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Error al consultar');
            ultimoPayload = data;
            renderMatriz(data);
            const nCols = (data.columns || []).length;
            msg.textContent = nCols
                ? `${nCols} concepto(s) · TOTAL INGRESOS ${fmtNum(data.total_ingresos)}.`
                : 'Sin resultados.';
            msg.className = 'small mt-2 text-muted';
        } catch (e) {
            ultimoPayload = null;
            renderVacio('Sin datos');
            lblTrabajador.textContent = '';
            msg.textContent = e.message || String(e);
            msg.className = 'small mt-2 text-danger';
        }
    }

    async function exportExcel() {
        if (!ultimoPayload || !(ultimoPayload.columns || []).length) return;
        const columns = ultimoPayload.columns;
        const rows = ultimoPayload.rows || [];
        const subtots = ultimoPayload.subtotals || {};
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Subsidios');
        ws.addRow(['Mes', ...columns.map((c) => c.description)]);
        ws.getRow(1).font = { bold: true };
        rows.forEach((r) => {
            ws.addRow([
                r.month_lbl,
                ...columns.map((c) => Number((r.values && r.values[c.concept]) || 0)),
            ]);
        });
        ws.addRow(['SUBTOTAL', ...columns.map((c) => Number(subtots[c.concept] || 0))]);
        ws.addRow(['TOTAL INGRESOS', Number(ultimoPayload.total_ingresos || 0)]);
        ws.addRow(['MESES', Number(ultimoPayload.meses || 0)]);
        ws.addRow(['PROMEDIO', Number(ultimoPayload.promedio || 0)]);
        ws.getColumn(1).width = 16;
        for (let c = 2; c <= columns.length + 1; c++) {
            ws.getColumn(c).numFmt = '#,##0.00';
            ws.getColumn(c).width = 14;
        }
        const buf = await wb.xlsx.writeBuffer();
        const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const person = ultimoPayload.person || CombosCarga.valorValido(cboTrabajador) || '';
        a.download = `reporte_subsidios_${person}_${CombosCarga.valorValido(cboPeriodo) || ''}_${new Date().toISOString().slice(0, 10)}.xlsx`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    document.getElementById('frmSubsidios').addEventListener('submit', consultar);
    btnExcel.addEventListener('click', exportExcel);

    cboCia.addEventListener('change', async function () {
        await cargarDependientesCia(CombosCarga.valorValido(this), {});
        guardarFiltros();
        actualizarTitulo();
    });
    cboPlanilla.addEventListener('change', async function () {
        const cia = CombosCarga.valorValido(cboCia);
        await cargarProcesos(cia, CombosCarga.valorValido(this), null);
        await cargarPeriodos(cia, CombosCarga.valorValido(this), CombosCarga.valorValido(cboProceso), '');
        guardarFiltros();
        actualizarTitulo();
    });
    cboProceso.addEventListener('change', async function () {
        await cargarPeriodos(
            CombosCarga.valorValido(cboCia),
            CombosCarga.valorValido(cboPlanilla),
            CombosCarga.valorValido(this),
            ''
        );
        guardarFiltros();
        actualizarTitulo();
    });
    [cboPeriodo, cboTrabajador].forEach((el) => {
        el.addEventListener('change', () => { guardarFiltros(); actualizarTitulo(); });
    });

    const guardado = leerFiltros();
    await poblarSelect('/api/selectores/companias?filtro_usuario=1', cboCia);
    if (guardado.cia && optionExists(cboCia, guardado.cia)) cboCia.value = guardado.cia;
    else if (optionExists(cboCia, DEFAULT_CIA)) cboCia.value = DEFAULT_CIA;

    const ciaIni = CombosCarga.valorValido(cboCia);
    if (ciaIni) {
        cboCia.disabled = true;
        try {
            await cargarDependientesCia(ciaIni, {
                planilla: { valor: guardado.payrolltype },
                proceso: { valor: guardado.process },
                period: guardado.period || '',
                trabajador: { valor: guardado.person },
            });
        } finally {
            cboCia.disabled = false;
        }
    }
    actualizarTitulo();
});
</script>
{% endblock %}
