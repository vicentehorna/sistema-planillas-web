{% extends "layout.html" %}

{% block title %}Log de cálculo de planillas{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-planilla-vertical {
        --sticky-col1-w: 5.75rem;
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-planilla-vertical th,
    .table-planilla-vertical td {
        padding: 0.2rem 0.4rem;
        vertical-align: middle;
    }

    .table-planilla-vertical thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-planilla-vertical .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 1;
        background-color: #fff;
        min-width: var(--sticky-col1-w);
        width: var(--sticky-col1-w);
        max-width: var(--sticky-col1-w);
        box-sizing: border-box;
    }

    .table-planilla-vertical .sticky-col-2 {
        position: sticky;
        left: var(--sticky-col1-w);
        z-index: 1;
        background-color: #fff;
        min-width: 13rem;
        max-width: 14rem;
        box-sizing: border-box;
    }

    .table-planilla-vertical thead th.sticky-col-1,
    .table-planilla-vertical thead th.sticky-col-2 {
        z-index: 3;
        background-color: #f8f9fa;
    }

    .table-planilla-vertical thead th.th-sort {
        cursor: pointer;
        user-select: none;
    }

    .table-planilla-vertical thead th.th-sort:hover {
        background-color: #e4eaf2;
    }

    .table-planilla-vertical thead th.th-sort .sort-ind {
        margin-left: 0.25rem;
        color: #0d6efd;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
        <h5 class="mb-0 fw-bold text-secondary"><i class="bi bi-journal-text"></i> Log de cálculo de planillas</h5>
    </div>
    <div class="card-body">
        <form id="frmLogCalculo" class="row g-3">
            <div class="col-md-3">
                <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted">Tipo planilla</label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="cboProceso" class="form-label small fw-bold text-muted">Proceso</label>
                <select id="cboProceso" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="cboPeriodo" class="form-label small fw-bold text-muted">Periodo</label>
                <select id="cboPeriodo" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="cboTrabajador" class="form-label small fw-bold text-muted">Empleado <span class="fw-normal opacity-75">(opcional)</span></label>
                <select id="cboTrabajador" class="form-select form-select-sm" disabled>
                    <option value="">Todos (por defecto)</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="submit" class="btn btn-primary btn-sm px-4"><i class="bi bi-search"></i> Consultar</button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcelLog" disabled><i class="bi bi-file-earmark-excel"></i> Exportar a Excel</button>
                <span class="ms-auto text-muted small fw-bold">No. de Registros: <span id="lblRowCountLog">0</span></span>
</div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoLogCalculo">
    <div class="card-body">
        <h4 class="text-center fw-bold mb-3">LOG DE CÁLCULO DE PLANILLAS</h4>
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-planilla-vertical align-middle">
                <thead id="thead-log-calculo"></thead>
                <tbody id="tbody-log-calculo"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/combos_carga.js') }}"></script>
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.logCalculo
        ? window.FiltrosPlanillasReportes.logCalculo()
        : null;

    const URL_REPORTE = {{ url_for('reporte_log_calculo_post') | tojson }};
    const IDX_STICKY_1 = 0;
    const IDX_STICKY_2 = 1;
    const IDX_COL_IMPORTE = 5;
    const IDX_CENTRO = new Set([2, 8, 9, 10, 11]);

    let lastExportLogCalculo = null;
    let datosLogCalculo = null;
    const ordenLog = { idx: -1, dir: 1 };
    const collatorEs = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function optionExists(select, value) {
        if (!select || value === '' || value == null) return false;
        const v = String(value);
        return Array.from(select.options).some((o) => o.value === v);
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value) === v);
        if (!ok) select.value = '';
    }

    function etiquetaTrabajadorTodosPorDefecto(selectElement) {
        if (!selectElement || !selectElement.options.length) return;
        const o = selectElement.options[0];
        if (o && o.value === '') o.textContent = 'Todos (por defecto)';
    }

    function fmtCelda(valor) {
        if (valor === null || valor === undefined || valor === '') return '';
        if (typeof valor === 'number' && Number.isFinite(valor)) {
            return valor.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return String(valor);
    }

    function selectedText(id) {
        const el = document.getElementById(id);
        const opt = el && el.options[el.selectedIndex];
        return opt ? opt.textContent.trim() : '';
    }

    function compararValoresLog(a, b) {
        const vacioA = a === null || a === undefined || a === '';
        const vacioB = b === null || b === undefined || b === '';
        if (vacioA || vacioB) return vacioA === vacioB ? 0 : (vacioA ? 1 : -1);
        if (typeof a === 'number' && typeof b === 'number') return a - b;
        return collatorEs.compare(String(a).trim(), String(b).trim());
    }

    /* Copia ordenada; con orden igual conserva la secuencia original del cálculo. */
    function filasOrdenadasLog() {
        const filas = (datosLogCalculo && datosLogCalculo.data) || [];
        if (ordenLog.idx < 0) return filas.slice();
        const idx = ordenLog.idx;
        return filas
            .map((fila, pos) => ({ fila, pos }))
            .sort((x, y) => {
                const va = (x.fila || [])[idx];
                const vb = (y.fila || [])[idx];
                const vacio = (v) => v === null || v === undefined || v === '';
                if (vacio(va) || vacio(vb)) return compararValoresLog(va, vb) || (x.pos - y.pos);
                return (compararValoresLog(va, vb) * ordenLog.dir) || (x.pos - y.pos);
            })
            .map((x) => x.fila);
    }

    function actualizarIndicadoresOrdenLog() {
        document.querySelectorAll('#thead-log-calculo th.th-sort').forEach((th) => {
            const idx = Number(th.getAttribute('data-idx'));
            const activo = idx === ordenLog.idx;
            th.querySelector('.sort-ind').textContent = activo ? (ordenLog.dir === 1 ? '▲' : '▼') : '';
            th.title = activo
                ? (ordenLog.dir === 1 ? 'Orden ascendente (clic para descendente)' : 'Orden descendente (clic para ascendente)')
                : 'Clic para ordenar por esta columna';
        });
    }

    function renderizarTablaLogCalculo(response) {
        datosLogCalculo = response;
        const thead = document.getElementById('thead-log-calculo');
        const headers = response.headers || [];
        if (ordenLog.idx >= headers.length) ordenLog.idx = -1;

        let htmlHeaders = '<tr>';
        headers.forEach((header, index) => {
            let sticky = '';
            if (index === IDX_STICKY_1) sticky = 'sticky-col-1';
            else if (index === IDX_STICKY_2) sticky = 'sticky-col-2';
            const cen = IDX_CENTRO.has(index) ? ' text-center' : '';
            const end = index === IDX_COL_IMPORTE ? ' text-end' : '';
            htmlHeaders += `<th class="th-sort ${sticky}${cen}${end}" data-idx="${index}">${escapeHtml(header)}<span class="sort-ind"></span></th>`;
        });
        htmlHeaders += '</tr>';
        thead.innerHTML = htmlHeaders;
        actualizarIndicadoresOrdenLog();
        renderizarFilasLogCalculo();
    }

    function renderizarFilasLogCalculo() {
        const tbody = document.getElementById('tbody-log-calculo');
        const filas = filasOrdenadasLog();
        if (lastExportLogCalculo) lastExportLogCalculo.data = filas;
        let htmlBody = '';
        filas.forEach((rowVals) => {
            htmlBody += '<tr>';
            (rowVals || []).forEach((valor, index) => {
                let sticky = '';
                if (index === IDX_STICKY_1) sticky = 'sticky-col-1 font-monospace fw-bold';
                else if (index === IDX_STICKY_2) sticky = 'sticky-col-2 text-truncate';
                const isNum = typeof valor === 'number' && Number.isFinite(valor);
                let align = '';
                if (index === IDX_COL_IMPORTE && isNum) align = 'text-end';
                else if (IDX_CENTRO.has(index)) align = 'text-center';
                const txt = isNum ? fmtCelda(valor) : escapeHtml(fmtCelda(valor));
                htmlBody += `<td class="${[sticky, align].filter(Boolean).join(' ')}">${txt}</td>`;
            });
            htmlBody += '</tr>';
        });

        tbody.innerHTML = htmlBody;
        document.getElementById('lblRowCountLog').textContent = String(filas.length);
    }

    async function exportLogCalculoExcel(payload, meta) {
        if (typeof ExcelJS === 'undefined') {
            alert('No se pudo cargar la librería de Excel (ExcelJS). Recargue la página e intente de nuevo.');
            return;
        }
        const headers = payload.headers || [];
        const filas = payload.data || [];
        const ncols = headers.length;
        if (!ncols) return;

        const F = {
            title: 'FFE9ECEF',
            meta: 'FFF8F9FA',
            header: 'FFF8F9FA',
            data: 'FFFFFFFF'
        };
        const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
        const allBorders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };
        const alignCenter = { horizontal: 'center', vertical: 'middle' };

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('LogCalculo', { views: [{ showGridLines: true }] });

        let rowIdx = 1;
        ws.mergeCells(rowIdx, 1, rowIdx, ncols);
        const titleCell = ws.getCell(rowIdx, 1);
        titleCell.value = 'LOG DE CÁLCULO DE PLANILLAS';
        titleCell.font = { bold: true, size: 14 };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        titleCell.fill = fill(F.title);
        titleCell.border = allBorders;
        ws.getRow(rowIdx).height = 26;
        rowIdx++;

        const metaRow = ws.addRow([
            'Compañía', meta.compania || '',
            'Tipo planilla', meta.tipoPlanilla || '',
            'Proceso', meta.proceso || '',
            'Periodo', meta.periodo || ''
        ]);
        metaRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            if (colNumber <= 6) {
                cell.fill = fill(F.meta);
                cell.font = { bold: colNumber % 2 === 1 };
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        ws.addRow([]);
        rowIdx++;

        const hRow = ws.addRow(headers);
        hRow.font = { bold: true };
        hRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            const idx = colNumber - 1;
            cell.fill = fill(F.header);
            if (idx === IDX_COL_IMPORTE) {
                cell.alignment = { horizontal: 'right', vertical: 'middle' };
            } else if (IDX_CENTRO.has(idx)) {
                cell.alignment = alignCenter;
            } else if (idx === IDX_STICKY_2) {
                cell.alignment = { horizontal: 'left', vertical: 'middle' };
            } else {
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        filas.forEach((rowVals) => {
            const r = ws.addRow(rowVals || []);
            r.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                const idx = colNumber - 1;
                const v = rowVals && rowVals[idx];
                cell.fill = fill(F.data);
                cell.border = allBorders;
                if (idx === IDX_COL_IMPORTE && typeof v === 'number' && Number.isFinite(v)) {
                    cell.numFmt = '#,##0.00';
                    cell.alignment = { horizontal: 'right', vertical: 'middle' };
                } else if (IDX_CENTRO.has(idx)) {
                    cell.alignment = alignCenter;
                } else if (idx === IDX_STICKY_2) {
                    cell.alignment = { horizontal: 'left', vertical: 'middle' };
                } else {
                    cell.alignment = alignCenter;
                }
            });
            rowIdx++;
        });

        ws.getColumn(1).width = 12;
        ws.getColumn(2).width = 32;
        ws.getColumn(3).width = 12;
        ws.getColumn(4).width = 28;
        ws.getColumn(5).width = 14;
        ws.getColumn(6).width = 14;
        for (let c = 7; c <= ncols; c++) {
            ws.getColumn(c).width = 14;
        }

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safe = (s) => String(s || 'export').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80);
        const stamp = new Date().toISOString().slice(0, 10);
        a.download = `log_calculo_planillas_${safe(meta.compania)}_${stamp}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    async function ejecutarConsultaLogCalculo() {
        lastExportLogCalculo = null;
        document.getElementById('btnExportExcelLog').disabled = true;
        const btnConsultar = document.querySelector('#frmLogCalculo button[type="submit"]');
        const lblCount = document.getElementById('lblRowCountLog');
        if (btnConsultar) btnConsultar.disabled = true;
        if (lblCount) lblCount.textContent = '...';
        if (filtrosPersist) filtrosPersist.guardar();
        const cia = document.getElementById('cboCompania').value.trim();
        const payroll_type = document.getElementById('cboTipoPlanilla').value.trim();
        const process = document.getElementById('cboProceso').value.trim();
        const period = document.getElementById('cboPeriodo').value.trim();
        let person = document.getElementById('cboTrabajador').value.trim();
        if (!person) person = '0';

        try {
            const res = await fetch(URL_REPORTE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, payroll_type, process, period, person })
            });
            const payload = await res.json();
            if (!res.ok) {
                document.getElementById('cardResultadoLogCalculo').classList.add('d-none');
                document.getElementById('lblRowCountLog').textContent = '0';
                alert(payload.error || 'Error al generar el reporte.');
                return;
            }
            if (payload.error) {
                document.getElementById('cardResultadoLogCalculo').classList.add('d-none');
                document.getElementById('lblRowCountLog').textContent = '0';
                alert(payload.error);
                return;
            }
            if (!Array.isArray(payload.headers) || !Array.isArray(payload.data)) {
                alert('Respuesta inválida del servidor.');
                document.getElementById('cardResultadoLogCalculo').classList.add('d-none');
                document.getElementById('lblRowCountLog').textContent = '0';
                return;
            }
            document.getElementById('cardResultadoLogCalculo').classList.remove('d-none');
            renderizarTablaLogCalculo(payload);
            lastExportLogCalculo = {
                headers: payload.headers,
                data: filasOrdenadasLog(),
                meta: {
                    compania: selectedText('cboCompania'),
                    tipoPlanilla: selectedText('cboTipoPlanilla'),
                    proceso: selectedText('cboProceso'),
                    periodo: selectedText('cboPeriodo')
                }
            };
            document.getElementById('btnExportExcelLog').disabled = false;
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoLogCalculo').classList.add('d-none');
            document.getElementById('btnExportExcelLog').disabled = true;
            document.getElementById('lblRowCountLog').textContent = '0';
            alert('Error de red o del servidor.');
        } finally {
            const btnConsultar = document.querySelector('#frmLogCalculo button[type="submit"]');
            if (btnConsultar) btnConsultar.disabled = false;
        }
    }

    const poblarSelect = CombosCarga.poblarSelect;
    const { resetSelect, valorValido, textoValido, seleccionarPorTexto } = CombosCarga;

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPlanilla = document.getElementById('cboTipoPlanilla');
    const cboProceso = document.getElementById('cboProceso');
    const cboPeriodo = document.getElementById('cboPeriodo');
    const cboTrabajador = document.getElementById('cboTrabajador');

    /* Cada cambio de compañía/planilla/proceso invalida las cascadas anteriores aún en curso. */
    let generacionFiltros = 0;

    function cargarTrabajadores() {
        const cia = valorValido(cboCia);
        if (!cia) {
            resetSelect(cboTrabajador, 'Todos (por defecto)');
            return Promise.resolve(false);
        }
        return poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(cia)}`, cboTrabajador, {
            conservarValor: true,
            alCargar: etiquetaTrabajadorTodosPorDefecto
        });
    }

    async function cargarPeriodos(periodoPreferido) {
        const cia = valorValido(cboCia);
        const pt = valorValido(cboPlanilla);
        const proc = valorValido(cboProceso);
        if (!cia || !pt || !proc) {
            resetSelect(cboPeriodo);
            return false;
        }
        const ok = await poblarSelect(
            `/api/selectores/periodos?cia=${encodeURIComponent(cia)}&payrolltype=${encodeURIComponent(pt)}&processtype=${encodeURIComponent(proc)}`,
            cboPeriodo,
            { textoVacio: 'Sin periodos' }
        );
        if (ok && periodoPreferido && optionExists(cboPeriodo, periodoPreferido)) {
            cboPeriodo.value = periodoPreferido;
        }
        return ok;
    }

    async function cargarProcesos(procesoPreferido, periodoPreferido) {
        const cia = valorValido(cboCia);
        const pt = valorValido(cboPlanilla);
        resetSelect(cboPeriodo);
        if (!cia || !pt) {
            resetSelect(cboProceso);
            return false;
        }
        const ok = await poblarSelect(
            `/api/selectores/procesos?cia=${encodeURIComponent(cia)}&payrolltype=${encodeURIComponent(pt)}`,
            cboProceso,
            { textoVacio: 'Sin procesos' }
        );
        if (ok && procesoPreferido && seleccionarPorTexto(cboProceso, procesoPreferido)) {
            await cargarPeriodos(periodoPreferido);
        }
        return ok;
    }

    /* Planillas y trabajadores en paralelo; conserva planilla y proceso por nombre, y el periodo si existe. */
    async function cargarDependientesCompania(planillaPrevia, procesoPrevio, periodoPrevio) {
        const gen = ++generacionFiltros;
        const cia = valorValido(cboCia);
        resetSelect(cboProceso);
        resetSelect(cboPeriodo);
        if (!cia) {
            resetSelect(cboPlanilla);
            resetSelect(cboTrabajador, 'Todos (por defecto)');
            return false;
        }
        const [ok] = await Promise.all([
            poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cia)}`, cboPlanilla, { textoVacio: 'Sin planillas' }),
            cargarTrabajadores(),
        ]);
        if (gen === generacionFiltros && ok && planillaPrevia && seleccionarPorTexto(cboPlanilla, planillaPrevia)) {
            await cargarProcesos(procesoPrevio, periodoPrevio);
        }
        return ok;
    }

    cboCia.addEventListener('change', function () {
        cargarDependientesCompania(textoValido(cboPlanilla), textoValido(cboProceso), valorValido(cboPeriodo));
    });

    cboPlanilla.addEventListener('change', function () {
        ++generacionFiltros;
        cargarProcesos();
    });

    cboProceso.addEventListener('change', function () {
        ++generacionFiltros;
        cargarPeriodos();
    });

    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
    }

    document.getElementById('thead-log-calculo').addEventListener('click', function (e) {
        const th = e.target.closest('th.th-sort');
        if (!th || !datosLogCalculo) return;
        const idx = Number(th.getAttribute('data-idx'));
        if (ordenLog.idx === idx) {
            ordenLog.dir = -ordenLog.dir;
        } else {
            ordenLog.idx = idx;
            ordenLog.dir = 1;
        }
        actualizarIndicadoresOrdenLog();
        renderizarFilasLogCalculo();
    });

    document.getElementById('frmLogCalculo').addEventListener('submit', async function (e) {
        e.preventDefault();
        await ejecutarConsultaLogCalculo();
    });

    document.getElementById('btnExportExcelLog').addEventListener('click', async function () {
        if (!lastExportLogCalculo || !lastExportLogCalculo.headers || !lastExportLogCalculo.headers.length) {
            alert('Ejecute primero una búsqueda con resultados.');
            return;
        }
        try {
            await exportLogCalculoExcel(
                { headers: lastExportLogCalculo.headers, data: lastExportLogCalculo.data },
                lastExportLogCalculo.meta
            );
        } catch (err) {
            console.error(err);
            alert('No se pudo generar el archivo Excel.');
        }
    });

    /* Bloquea compañía mientras se restaura la cascada guardada para que no se crucen cargas. */
    const companiasOk = await poblarSelect('/api/selectores/companias?filtro_usuario=1', cboCia);
    if (!companiasOk) return;

    const guardadoObj = filtrosPersist ? filtrosPersist.leer() : null;
    const ciaGuardada = guardadoObj ? String(guardadoObj.cia || '').trim() : '';
    if (filtrosPersist && ciaGuardada) {
        cboCia.disabled = true;
        try {
            await filtrosPersist.aplicarRestauracionCascada({ poblarSelect, cargarTrabajadores });
        } finally {
            cboCia.disabled = false;
        }
    }

    limpiarValorComboSiObsoleto(cboCia);
    if (!valorValido(cboCia)) {
        if (seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA)) {
            await cargarDependientesCompania();
        }
    } else if (cboTrabajador.disabled) {
        await cargarTrabajadores();
    }

    if (valorValido(cboCia) && valorValido(cboPlanilla) && valorValido(cboProceso) && valorValido(cboPeriodo)) {
        await ejecutarConsultaLogCalculo();
    }
});
</script>
{% endblock %}
