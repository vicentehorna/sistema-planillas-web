{% extends "layout.html" %}

{% block title %}Saldo de vacaciones{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-planilla-vertical {
        --sticky-col1-w: 5.75rem;
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-planilla-vertical th,
    .table-planilla-vertical td {
        padding: 0.2rem 0.4rem;
        vertical-align: middle;
    }

    .table-planilla-vertical thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-planilla-vertical .sticky-col-1 {
        position: sticky;
        left: 0;
        z-index: 1;
        background-color: #fff;
        min-width: var(--sticky-col1-w);
        width: var(--sticky-col1-w);
        max-width: var(--sticky-col1-w);
        box-sizing: border-box;
    }

    .table-planilla-vertical .sticky-col-2 {
        position: sticky;
        left: var(--sticky-col1-w);
        z-index: 1;
        background-color: #fff;
        min-width: 13rem;
        max-width: 14rem;
        box-sizing: border-box;
    }

    .table-planilla-vertical thead th.sticky-col-1,
    .table-planilla-vertical thead th.sticky-col-2 {
        z-index: 3;
        background-color: #f8f9fa;
    }

    .table-planilla-vertical thead th.col-saldo-final {
        background-color: #ffe69c !important;
        color: #5c4a00;
        font-weight: 700;
    }

    .table-planilla-vertical tbody td.col-saldo-final {
        background-color: #fff8e1;
        font-weight: 700;
        color: #4a3d00;
    }

    .table-planilla-vertical tbody tr:hover td.col-saldo-final {
        background-color: #ffefb3;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body pt-3">
        <form id="frmSaldoVacaciones" class="row g-3">
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted">Tipo planilla</label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-md-6 col-lg-3">
                <label for="cboTrabajador" class="form-label small fw-bold text-muted">Empleado <span class="fw-normal opacity-75">(opcional)</span></label>
                <select id="cboTrabajador" class="form-select form-select-sm" disabled>
                    <option value="">Todos (por defecto)</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="txtFecha" class="form-label small fw-bold text-muted">Fecha</label>
                <input type="date" id="txtFecha" class="form-control form-control-sm" required>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <label for="cboCesados" class="form-label small fw-bold text-muted">Cesados</label>
                <select id="cboCesados" class="form-select form-select-sm" required>
                    <option value="T" selected>Todos</option>
                    <option value="Y">Sí</option>
                    <option value="N">No</option>
                </select>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="submit" class="btn btn-primary btn-sm px-4"><i class="bi bi-search"></i> Consultar</button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnExportExcelSaldoVac" disabled><i class="bi bi-file-earmark-excel"></i> Exportar a Excel</button>
                <span class="ms-auto text-muted small fw-bold">No. de Registros: <span id="lblRowCountSaldoVac">0</span></span>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoSaldoVacaciones">
    <div class="card-body">
        <h4 class="text-center fw-bold mb-3">SALDO DE VACACIONES</h4>
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-planilla-vertical align-middle">
                <thead id="thead-saldo-vacaciones"></thead>
                <tbody id="tbody-saldo-vacaciones"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.saldoVacaciones
        ? window.FiltrosPlanillasReportes.saldoVacaciones()
        : null;

    const URL_REPORTE = {{ url_for('reporte_saldo_vacaciones_post') | tojson }};
    /** Columnas sticky: Código (1) y Nombre (2). */
    const IDX_STICKY_1 = 1;
    const IDX_STICKY_2 = 2;
    /** Centrados: F. ingreso, F. cese */
    const IDX_CENTRO = new Set([4, 5]);
    /** Numéricos alineados a la derecha: saldos, faltas, licencias, descansos, saldo */
    const IDX_NUMERICOS = new Set([6, 7, 8, 9, 10, 11, 12, 13, 14]);
    const IDX_ENTEROS = new Set([11, 12, 13]);
    const IDX_SALDO_FINAL = 14;

    let lastExportSaldoVac = null;

    function hoyIsoLocal() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function optionExists(select, value) {
        if (!select || value === '' || value == null) return false;
        const v = String(value);
        return Array.from(select.options).some((o) => o.value === v);
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value) === v);
        if (!ok) select.value = '';
    }

    function etiquetaTrabajadorTodosPorDefecto(selectElement) {
        if (!selectElement || !selectElement.options.length) return;
        const o = selectElement.options[0];
        if (o && o.value === '') o.textContent = 'Todos (por defecto)';
    }

    function fmtCelda(valor, opts) {
        opts = opts || {};
        if (valor === null || valor === undefined || valor === '') return '';
        if (typeof valor === 'number' && Number.isFinite(valor)) {
            if (opts.entero || Number.isInteger(valor)) {
                return String(Math.round(valor));
            }
            return valor.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return String(valor);
    }

    function selectedText(id) {
        const el = document.getElementById(id);
        const opt = el && el.options[el.selectedIndex];
        return opt ? opt.textContent.trim() : '';
    }

    function renderizarTablaSaldoVacaciones(response) {
        const thead = document.getElementById('thead-saldo-vacaciones');
        const tbody = document.getElementById('tbody-saldo-vacaciones');
        const headers = response.headers || [];

        let htmlHeaders = '<tr>';
        headers.forEach((header, index) => {
            let sticky = '';
            if (index === IDX_STICKY_1) sticky = 'sticky-col-1';
            else if (index === IDX_STICKY_2) sticky = 'sticky-col-2';
            const cen = IDX_CENTRO.has(index) ? ' text-center' : '';
            const num = IDX_NUMERICOS.has(index) ? ' text-end' : '';
            const saldoFinal = index === IDX_SALDO_FINAL ? ' col-saldo-final' : '';
            htmlHeaders += `<th class="${sticky}${cen}${num}${saldoFinal}">${escapeHtml(header)}</th>`;
        });
        htmlHeaders += '</tr>';
        thead.innerHTML = htmlHeaders;

        const filas = response.data || [];
        let htmlBody = '';
        filas.forEach((rowVals) => {
            htmlBody += '<tr>';
            (rowVals || []).forEach((valor, index) => {
                let sticky = '';
                if (index === IDX_STICKY_1) sticky = 'sticky-col-1 font-monospace fw-bold';
                else if (index === IDX_STICKY_2) sticky = 'sticky-col-2 text-truncate';
                const isNum = typeof valor === 'number' && Number.isFinite(valor);
                let align = '';
                if (IDX_CENTRO.has(index)) align = 'text-center';
                else if (isNum && IDX_NUMERICOS.has(index)) align = 'text-end';
                const saldoFinal = index === IDX_SALDO_FINAL ? 'col-saldo-final' : '';
                const txt =
                    isNum && IDX_ENTEROS.has(index)
                        ? fmtCelda(valor, { entero: true })
                        : isNum
                            ? fmtCelda(valor)
                            : escapeHtml(fmtCelda(valor));
                htmlBody += `<td class="${[sticky, align, saldoFinal].filter(Boolean).join(' ')}">${txt}</td>`;
            });
            htmlBody += '</tr>';
        });

        tbody.innerHTML = htmlBody;
        document.getElementById('lblRowCountSaldoVac').textContent = String(filas.length);
    }

    async function exportSaldoVacacionesExcel(payload, meta) {
        if (typeof ExcelJS === 'undefined') {
            alert('No se pudo cargar la librería de Excel (ExcelJS). Recargue la página e intente de nuevo.');
            return;
        }
        const headers = payload.headers || [];
        const filas = payload.data || [];
        const ncols = headers.length;
        if (!ncols) return;

        const F = {
            title: 'FFE9ECEF',
            meta: 'FFF8F9FA',
            header: 'FFF8F9FA',
            data: 'FFFFFFFF',
            saldoFinal: 'FFFFF8E1',
            saldoFinalHeader: 'FFFFE69C'
        };
        const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
        const borderThin = { style: 'thin', color: { argb: 'FFCCCCCC' } };
        const allBorders = { top: borderThin, left: borderThin, bottom: borderThin, right: borderThin };
        const alignCenter = { horizontal: 'center', vertical: 'middle' };

        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Saldo Vacaciones', { views: [{ showGridLines: true }] });

        let rowIdx = 1;
        ws.mergeCells(rowIdx, 1, rowIdx, ncols);
        const titleCell = ws.getCell(rowIdx, 1);
        titleCell.value = 'SALDO DE VACACIONES';
        titleCell.font = { bold: true, size: 14 };
        titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
        titleCell.fill = fill(F.title);
        titleCell.border = allBorders;
        ws.getRow(rowIdx).height = 26;
        rowIdx++;

        const metaRow = ws.addRow([
            'Compañía', meta.compania || '',
            'Tipo planilla', meta.tipoPlanilla || '',
            'Fecha', meta.fecha || '',
            'Cesados', meta.cesados || ''
        ]);
        metaRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            if (colNumber <= 8) {
                cell.fill = fill(F.meta);
                cell.font = { bold: colNumber % 2 === 1 };
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        ws.addRow([]);
        rowIdx++;

        const hRow = ws.addRow(headers);
        hRow.font = { bold: true };
        hRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            const idx = colNumber - 1;
            cell.fill = fill(F.header);
            if (idx === IDX_SALDO_FINAL) {
                cell.fill = fill(F.saldoFinalHeader);
                cell.font = { bold: true };
            }
            if (IDX_NUMERICOS.has(idx)) {
                cell.alignment = { horizontal: 'right', vertical: 'middle' };
            } else if (IDX_CENTRO.has(idx)) {
                cell.alignment = alignCenter;
            } else if (idx === IDX_STICKY_2) {
                cell.alignment = { horizontal: 'left', vertical: 'middle' };
            } else {
                cell.alignment = alignCenter;
            }
            cell.border = allBorders;
        });
        rowIdx++;

        filas.forEach((rowVals) => {
            const r = ws.addRow(rowVals || []);
            r.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                const idx = colNumber - 1;
                const v = rowVals && rowVals[idx];
                cell.fill = fill(F.data);
                cell.border = allBorders;
                if (idx === IDX_SALDO_FINAL) {
                    cell.fill = fill(F.saldoFinal);
                    cell.font = { bold: true };
                }
                if (typeof v === 'number' && Number.isFinite(v)) {
                    cell.numFmt = IDX_ENTEROS.has(idx) ? '0' : '#,##0.00';
                    cell.alignment = { horizontal: 'right', vertical: 'middle' };
                } else if (IDX_CENTRO.has(idx)) {
                    cell.alignment = alignCenter;
                } else if (idx === IDX_STICKY_2) {
                    cell.alignment = { horizontal: 'left', vertical: 'middle' };
                } else {
                    cell.alignment = alignCenter;
                }
            });
            rowIdx++;
        });

        ws.getColumn(1).width = 14;
        ws.getColumn(2).width = 12;
        ws.getColumn(3).width = 36;
        for (let c = 4; c <= ncols; c++) {
            ws.getColumn(c).width = 14;
        }

        const buffer = await wb.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safe = (s) => String(s || 'export').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80);
        const stamp = new Date().toISOString().slice(0, 10);
        a.download = `saldo_vacaciones_${safe(meta.compania)}_${stamp}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }

    async function ejecutarConsultaSaldoVacaciones() {
        lastExportSaldoVac = null;
        document.getElementById('btnExportExcelSaldoVac').disabled = true;
        if (filtrosPersist) filtrosPersist.guardar();
        const cia = document.getElementById('cboCompania').value.trim();
        const payroll_type = document.getElementById('cboTipoPlanilla').value.trim();
        let person = document.getElementById('cboTrabajador').value.trim();
        if (!person) person = '0';
        if (person === '0') {
            const ok = window.confirm(
                'Consultar todos los trabajadores puede tardar varios minutos y afectar el servicio web. '
                + '¿Desea continuar? (Recomendado: seleccione un trabajador.)'
            );
            if (!ok) return;
        }
        const fecha = document.getElementById('txtFecha').value.trim();
        const cesados = document.getElementById('cboCesados').value.trim() || 'T';

        try {
            const res = await fetch(URL_REPORTE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cia, payroll_type, person, fecha, cesados })
            });
            const payload = await res.json();
            if (!res.ok) {
                document.getElementById('cardResultadoSaldoVacaciones').classList.add('d-none');
                document.getElementById('lblRowCountSaldoVac').textContent = '0';
                alert(payload.error || 'Error al generar el reporte.');
                return;
            }
            if (payload.error) {
                document.getElementById('cardResultadoSaldoVacaciones').classList.add('d-none');
                document.getElementById('lblRowCountSaldoVac').textContent = '0';
                alert(payload.error);
                return;
            }
            if (!Array.isArray(payload.headers) || !Array.isArray(payload.data)) {
                alert('Respuesta inválida del servidor.');
                document.getElementById('cardResultadoSaldoVacaciones').classList.add('d-none');
                document.getElementById('lblRowCountSaldoVac').textContent = '0';
                return;
            }
            document.getElementById('cardResultadoSaldoVacaciones').classList.remove('d-none');
            renderizarTablaSaldoVacaciones(payload);
            lastExportSaldoVac = {
                headers: payload.headers,
                data: payload.data,
                meta: {
                    compania: selectedText('cboCompania'),
                    tipoPlanilla: selectedText('cboTipoPlanilla'),
                    fecha: payload.meta && payload.meta.fecha ? payload.meta.fecha : fecha,
                    cesados: selectedText('cboCesados')
                }
            };
            document.getElementById('btnExportExcelSaldoVac').disabled = false;
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoSaldoVacaciones').classList.add('d-none');
            document.getElementById('btnExportExcelSaldoVac').disabled = true;
            document.getElementById('lblRowCountSaldoVac').textContent = '0';
            alert('Error de red o del servidor.');
        }
    }

    const poblarSelect = async (url, selectElement) => {
        selectElement.innerHTML = '';
        const loading = document.createElement('option');
        loading.value = '';
        loading.textContent = 'Cargando...';
        selectElement.appendChild(loading);
        try {
            const res = await fetch(url);
            const data = await res.json();
            selectElement.innerHTML = '';
            const def = document.createElement('option');
            def.value = '';
            def.textContent = 'Seleccione...';
            selectElement.appendChild(def);
            (Array.isArray(data) ? data : []).forEach((item) => {
                const opt = document.createElement('option');
                opt.value = item.id != null ? String(item.id) : '';
                opt.textContent = item.text != null ? String(item.text) : '';
                selectElement.appendChild(opt);
            });
            selectElement.disabled = false;
        } catch (err) {
            console.error(err);
            selectElement.innerHTML = '<option value="">Error</option>';
        }
    };

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPlanilla = document.getElementById('cboTipoPlanilla');
    const cboTrabajador = document.getElementById('cboTrabajador');
    const txtFecha = document.getElementById('txtFecha');

    if (!txtFecha.value) {
        txtFecha.value = hoyIsoLocal();
    }

    await poblarSelect('/api/selectores/companias', cboCia);
    limpiarValorComboSiObsoleto(cboCia);

    const guardadoObj = filtrosPersist ? filtrosPersist.leer() : null;
    const ciaGuardada = guardadoObj ? String(guardadoObj.cia || '').trim() : '';
    if (filtrosPersist && ciaGuardada) {
        await filtrosPersist.aplicarRestauracionCascada({ poblarSelect });
        etiquetaTrabajadorTodosPorDefecto(cboTrabajador);
        if (guardadoObj.fecha) txtFecha.value = guardadoObj.fecha;
        if (guardadoObj.cesados && optionExists(document.getElementById('cboCesados'), guardadoObj.cesados)) {
            document.getElementById('cboCesados').value = guardadoObj.cesados;
        }
    }

    limpiarValorComboSiObsoleto(cboCia);
    if (!String(cboCia.value || '').trim()) {
        if (seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA)) {
            const ciaNorm = cboCia.value.trim();
            await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(ciaNorm)}`, cboPlanilla);
            await poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(ciaNorm)}`, cboTrabajador);
            etiquetaTrabajadorTodosPorDefecto(cboTrabajador);
        }
    }

    {
        const cia = cboCia.value.trim();
        const pt = cboPlanilla.value.trim();
        if (cia && pt) {
            await ejecutarConsultaSaldoVacaciones();
        }
    }

    document.getElementById('cboCompania').addEventListener('change', async function () {
        const cia = this.value;
        const cboPlanillaEl = document.getElementById('cboTipoPlanilla');
        const cboTrabajadorEl = document.getElementById('cboTrabajador');

        if (cia) {
            await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cia)}`, cboPlanillaEl);
            await poblarSelect(`/api/selectores/trabajadores?cia=${encodeURIComponent(cia)}`, cboTrabajadorEl);
            etiquetaTrabajadorTodosPorDefecto(cboTrabajadorEl);
        } else {
            cboPlanillaEl.innerHTML = '<option value="">Seleccione...</option>';
            cboPlanillaEl.disabled = true;
            cboTrabajadorEl.innerHTML = '<option value="">Seleccione...</option>';
            cboTrabajadorEl.disabled = true;
            etiquetaTrabajadorTodosPorDefecto(cboTrabajadorEl);
        }
    });

    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
    }

    document.getElementById('frmSaldoVacaciones').addEventListener('submit', async function (e) {
        e.preventDefault();
        await ejecutarConsultaSaldoVacaciones();
    });

    document.getElementById('btnExportExcelSaldoVac').addEventListener('click', async function () {
        if (!lastExportSaldoVac || !lastExportSaldoVac.headers || !lastExportSaldoVac.headers.length) {
            alert('Ejecute primero una búsqueda con resultados.');
            return;
        }
        try {
            await exportSaldoVacacionesExcel(
                { headers: lastExportSaldoVac.headers, data: lastExportSaldoVac.data },
                lastExportSaldoVac.meta
            );
        } catch (err) {
            console.error(err);
            alert('No se pudo generar el archivo Excel.');
        }
    });
});
</script>
{% endblock %}
