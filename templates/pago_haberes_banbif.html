{% extends "layout.html" %}

{% block title %}Pago Haberes BANBIF{% endblock %}

{% block extra_css %}
<style>
    .table-scroll-container {
        max-height: 65vh;
        overflow: auto;
        border: 1px solid #dee2e6;
    }

    .table-banbif {
        font-size: 11px;
        white-space: nowrap;
        margin-bottom: 0;
    }

    .table-banbif th,
    .table-banbif td {
        padding: 0.25rem 0.5rem;
        vertical-align: middle;
    }

    .table-banbif thead th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        z-index: 2;
        box-shadow: 0 1px 0 #dee2e6;
    }

    .table-banbif .form-check-input {
        width: 0.85rem;
        height: 0.85rem;
        margin: 0;
        vertical-align: middle;
    }

    .table-banbif .col-tipodoc {
        width: 2.25rem;
        max-width: 2.25rem;
        text-align: center;
        padding-left: 0.2rem;
        padding-right: 0.2rem;
    }

    .table-banbif .col-banco {
        min-width: 10rem;
        max-width: 14rem;
    }

    .table-banbif .col-importe {
        min-width: 5.5rem;
        text-align: right;
    }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mb-4">
    <div class="card-body pt-3">
        <form id="frmBanbif" class="row g-3">
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboCompania" class="form-label small fw-bold text-muted">Compañía</label>
                <select id="cboCompania" class="form-select form-select-sm" required>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboTipoPlanilla" class="form-label small fw-bold text-muted">Tipo planilla</label>
                <select id="cboTipoPlanilla" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboProceso" class="form-label small fw-bold text-muted">Proceso</label>
                <select id="cboProceso" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboPeriodo" class="form-label small fw-bold text-muted">Periodo</label>
                <select id="cboPeriodo" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="cboMoneda" class="form-label small fw-bold text-muted">Moneda</label>
                <select id="cboMoneda" class="form-select form-select-sm" required>
                    <option value="LO" selected>Soles (LO)</option>
                    <option value="EX">Dólares (EX)</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <label for="cboConcepto" class="form-label small fw-bold text-muted">Concepto</label>
                <select id="cboConcepto" class="form-select form-select-sm" required disabled>
                    <option value="">Seleccione...</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-2">
                <label for="txtFechaPago" class="form-label small fw-bold text-muted">Fecha de pago</label>
                <input type="date" id="txtFechaPago" class="form-control form-control-sm" required>
            </div>
            <div class="col-6 col-sm-4 col-md-3 col-lg-1">
                <label for="cboCesados" class="form-label small fw-bold text-muted">Cesados</label>
                <select id="cboCesados" class="form-select form-select-sm">
                    <option value="T" selected>Todos</option>
                    <option value="Y">Sí</option>
                    <option value="N">No</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex align-items-end pb-1">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkTodosBancos">
                    <label class="form-check-label small fw-bold text-muted" for="chkTodosBancos">
                        Todos los Bancos
                    </label>
                </div>
            </div>
            <div class="col-12 d-flex align-items-center flex-wrap gap-2 border-top pt-3 mt-3">
                <button type="button" class="btn btn-primary btn-sm px-4" id="btnListarBanbif"><i class="bi bi-search"></i> Listar trabajadores</button>
                <button type="button" class="btn btn-success btn-sm px-4" id="btnGenerarTxt" disabled>
                <i class="bi bi-file-earmark-arrow-down"></i> Generar TXT
                </button>
                <span class="ms-auto text-muted small fw-bold">
                No. de Registros: <span id="lblRowCountBan">0</span>
                · Seleccionados: <span id="lblSeleccionadosBan">0</span>
                · Importes totales: <span id="lblImporteTotalBan">0.00</span>
                </span>
            </div>
        </form>
    </div>
</div>

<div class="card shadow-sm border-0 d-none" id="cardResultadoBanbif">
    <div class="card-body pt-3">
        <div class="table-scroll-container">
            <table class="table table-bordered table-sm table-hover table-banbif align-middle">
                <thead id="thead-banbif"></thead>
                <tbody id="tbody-banbif"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/combos_carga.js') }}"></script>
<script src="{{ url_for('static', filename='js/filtros_reportes_planillas.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () {
    const filtrosPersist = window.FiltrosPlanillasReportes && window.FiltrosPlanillasReportes.banbif
        ? window.FiltrosPlanillasReportes.banbif()
        : null;

    const URL_LISTADO = {{ url_for('api_pago_haberes_banbif_listado') | tojson }};
    const URL_GENERAR_TXT = {{ url_for('api_pago_haberes_banbif_generar_txt') | tojson }};
    let lastRowsBanbif = [];

    function hoyIsoLocal() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
    }

    function optionExists(select, value) {
        if (!select || value === '' || value == null) return false;
        const v = String(value).trim();
        return Array.from(select.options).some((o) => String(o.value).trim() === v);
    }

    function seleccionarCompaniaInsensitive(select, codigoDeseado) {
        if (!select) return false;
        const want = String(codigoDeseado || '').trim().toUpperCase();
        if (!want) return false;
        const opt = Array.from(select.options).find((o) => String(o.value || '').trim().toUpperCase() === want);
        if (!opt) return false;
        select.value = opt.value;
        return true;
    }

    function limpiarValorComboSiObsoleto(select) {
        if (!select) return;
        const v = String(select.value || '').trim();
        if (!v) return;
        const ok = Array.from(select.options).some((o) => String(o.value) === v);
        if (!ok) select.value = '';
    }

    function obtenerSeleccionadosBanbif() {
        const mapa = new Map(
            (lastRowsBanbif || []).map((r) => [String(r.person || '').trim(), r])
        );
        const seleccionados = [];
        document.querySelectorAll('.check-banbif:checked').forEach((cb) => {
            const person = String(cb.value || '').trim();
            const row = mapa.get(person);
            if (row) seleccionados.push(row);
        });
        return seleccionados;
    }

    function formatearImporte(valor) {
        const n = Number(valor);
        if (!Number.isFinite(n)) return '0.00';
        return n.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function actualizarContadoresBanbif() {
        const total = document.querySelectorAll('.check-banbif').length;
        const seleccionados = obtenerSeleccionadosBanbif();
        const sel = seleccionados.length;
        const importeTotal = seleccionados.reduce((suma, row) => {
            const n = Number(row.importe);
            return suma + (Number.isFinite(n) ? n : 0);
        }, 0);

        document.getElementById('lblRowCountBan').textContent = String(total);
        document.getElementById('lblSeleccionadosBan').textContent = String(sel);
        document.getElementById('lblImporteTotalBan').textContent = formatearImporte(importeTotal);
        document.getElementById('btnGenerarTxt').disabled = sel === 0;
    }

    function sincronizarCheckAllBan() {
        const all = document.querySelectorAll('.check-banbif');
        const chk = document.getElementById('checkAllBan');
        if (!chk) return;
        if (!all.length) {
            chk.checked = false;
            chk.indeterminate = false;
            return;
        }
        let marcados = 0;
        all.forEach((x) => { if (x.checked) marcados++; });
        chk.checked = marcados === all.length;
        chk.indeterminate = marcados > 0 && marcados < all.length;
    }

    function renderizarEncabezadoTabla(mostrarBanco) {
        const thead = document.getElementById('thead-banbif');
        if (!thead) return;

        const tr = document.createElement('tr');

        const thChk = document.createElement('th');
        thChk.className = 'text-center';
        thChk.style.width = '2.5rem';
        const chkAll = document.createElement('input');
        chkAll.type = 'checkbox';
        chkAll.id = 'checkAllBan';
        chkAll.className = 'form-check-input';
        chkAll.title = 'Marcar / desmarcar todos';
        thChk.appendChild(chkAll);
        tr.appendChild(thChk);

        ['DNI', 'Tipo', 'Nombre'].forEach((texto, idx) => {
            const th = document.createElement('th');
            th.textContent = texto;
            if (idx === 1) th.className = 'col-tipodoc';
            tr.appendChild(th);
        });

        if (mostrarBanco) {
            const thBanco = document.createElement('th');
            thBanco.textContent = 'Banco';
            thBanco.className = 'col-banco';
            tr.appendChild(thBanco);
        }

        const thImporte = document.createElement('th');
        thImporte.textContent = 'Importe';
        thImporte.className = 'col-importe';
        tr.appendChild(thImporte);

        thead.innerHTML = '';
        thead.appendChild(tr);

        chkAll.addEventListener('change', function () {
            document.querySelectorAll('.check-banbif').forEach((cb) => {
                cb.checked = this.checked;
            });
            sincronizarCheckAllBan();
            actualizarContadoresBanbif();
        });
    }

    function renderizarTabla(rows, mostrarBanco) {
        renderizarEncabezadoTabla(!!mostrarBanco);

        const tbody = document.getElementById('tbody-banbif');
        tbody.innerHTML = '';
        const filas = Array.isArray(rows) ? rows : [];

        filas.forEach((row) => {
            const tr = document.createElement('tr');
            const person = String(row.person || '').trim();
            const dni = String(row.dni || '').trim();
            const tipodoc = String(row.tipodoc || '').trim();
            const nombre = String(row.nombre || '').trim();
            const banco = String(row.banco || '').trim();
            const importe = row.importe;

            const tdChk = document.createElement('td');
            tdChk.className = 'text-center';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'check-banbif form-check-input';
            cb.value = person;
            cb.checked = true;
            tdChk.appendChild(cb);

            const tdDni = document.createElement('td');
            tdDni.textContent = dni;

            const tdTipoDoc = document.createElement('td');
            tdTipoDoc.className = 'col-tipodoc';
            tdTipoDoc.textContent = tipodoc;

            const tdNombre = document.createElement('td');
            tdNombre.textContent = nombre;

            tr.appendChild(tdChk);
            tr.appendChild(tdDni);
            tr.appendChild(tdTipoDoc);
            tr.appendChild(tdNombre);

            if (mostrarBanco) {
                const tdBanco = document.createElement('td');
                tdBanco.className = 'col-banco';
                tdBanco.textContent = banco;
                tr.appendChild(tdBanco);
            }

            const tdImporte = document.createElement('td');
            tdImporte.className = 'col-importe';
            tdImporte.textContent = formatearImporte(importe);
            tr.appendChild(tdImporte);

            tbody.appendChild(tr);
        });

        sincronizarCheckAllBan();
        actualizarContadoresBanbif();
    }

    async function ejecutarListado() {
        if (filtrosPersist) filtrosPersist.guardar();

        lastRowsBanbif = [];
        document.getElementById('tbody-banbif').innerHTML = '';
        const chkAllInicio = document.getElementById('checkAllBan');
        if (chkAllInicio) {
            chkAllInicio.checked = false;
            chkAllInicio.indeterminate = false;
        }
        document.getElementById('lblRowCountBan').textContent = '0';
        document.getElementById('lblSeleccionadosBan').textContent = '0';
        document.getElementById('lblImporteTotalBan').textContent = '0.00';
        document.getElementById('btnGenerarTxt').disabled = true;

        const cia = document.getElementById('cboCompania').value.trim();
        const payrolltype = document.getElementById('cboTipoPlanilla').value.trim();
        const processtype = document.getElementById('cboProceso').value.trim();
        const period = document.getElementById('cboPeriodo').value.trim();
        const currency = document.getElementById('cboMoneda').value.trim();
        const concept = document.getElementById('cboConcepto').value.trim();
        const paydate = document.getElementById('txtFechaPago').value.trim();
        const cesados = document.getElementById('cboCesados').value.trim() || 'T';
        const todosBancos = document.getElementById('chkTodosBancos').checked;

        if (!cia || !payrolltype || !processtype || !period || !concept) {
            alert('Complete compañía, tipo planilla, proceso, periodo y concepto.');
            return;
        }

        try {
            const res = await fetch(URL_LISTADO, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cia, payrolltype, processtype, period, currency, concept, paydate, cesados,
                    todos_bancos: todosBancos
                })
            });
            const payload = await res.json();
            if (!res.ok || payload.error) {
                document.getElementById('cardResultadoBanbif').classList.add('d-none');
                document.getElementById('lblRowCountBan').textContent = '0';
                document.getElementById('lblSeleccionadosBan').textContent = '0';
                document.getElementById('lblImporteTotalBan').textContent = '0.00';
                alert(payload.error || 'Error al listar trabajadores.');
                return;
            }
            if (!Array.isArray(payload.headers) || !Array.isArray(payload.data)) {
                alert('Respuesta inválida del servidor.');
                return;
            }
            lastRowsBanbif = Array.isArray(payload.rows) ? payload.rows : [];
            document.getElementById('cardResultadoBanbif').classList.remove('d-none');
            const mostrarBanco = !!(payload.meta && payload.meta.todos_bancos);
            renderizarTabla(lastRowsBanbif, mostrarBanco);
        } catch (e) {
            console.error(e);
            document.getElementById('cardResultadoBanbif').classList.add('d-none');
            document.getElementById('lblRowCountBan').textContent = '0';
            document.getElementById('lblSeleccionadosBan').textContent = '0';
            document.getElementById('lblImporteTotalBan').textContent = '0.00';
            alert('Error de red o del servidor.');
        }
    }

    document.getElementById('frmBanbif').addEventListener('submit', function (e) {
        e.preventDefault();
    });
    document.getElementById('btnListarBanbif').addEventListener('click', ejecutarListado);

    const poblarSelect = CombosCarga.poblarSelect;

    const DEFAULT_CIA = 'BGT';
    const cboCia = document.getElementById('cboCompania');
    const cboPlanilla = document.getElementById('cboTipoPlanilla');
    const cboProceso = document.getElementById('cboProceso');
    const cboPeriodo = document.getElementById('cboPeriodo');
    const txtFechaPago = document.getElementById('txtFechaPago');

    if (!txtFechaPago.value) {
        txtFechaPago.value = hoyIsoLocal();
    }

    const FPR = window.FiltrosPlanillasReportes;
    const cboConcepto = document.getElementById('cboConcepto');
    const { resetSelect, valorValido, textoValido, seleccionarPorTexto } = CombosCarga;

    /* Cada cambio de compañía/planilla/proceso invalida las cascadas anteriores aún en curso. */
    let generacionFiltros = 0;

    async function cargarConceptos(cia, conceptoPreferido) {
        const ok = await FPR.poblarConceptosConNeto(cia, cboConcepto, poblarSelect);
        if (ok && conceptoPreferido) seleccionarPorTexto(cboConcepto, conceptoPreferido);
        return ok;
    }

    async function cargarPeriodos() {
        const cia = valorValido(cboCia);
        const payroll = valorValido(cboPlanilla);
        const proceso = valorValido(cboProceso);
        if (!cia || !payroll || !proceso) {
            resetSelect(cboPeriodo);
            return false;
        }
        return FPR.poblarPeriodosConActivo(cia, payroll, proceso, cboPeriodo, poblarSelect);
    }

    async function cargarProcesos(procesoPreferido) {
        const cia = valorValido(cboCia);
        const payroll = valorValido(cboPlanilla);
        resetSelect(cboPeriodo);
        if (!cia || !payroll) {
            resetSelect(cboProceso);
            return false;
        }
        const ok = await poblarSelect(
            `/api/selectores/procesos?cia=${encodeURIComponent(cia)}&payrolltype=${encodeURIComponent(payroll)}`,
            cboProceso,
            { textoVacio: 'Sin procesos' }
        );
        if (ok && procesoPreferido && seleccionarPorTexto(cboProceso, procesoPreferido)) {
            await cargarPeriodos();
        }
        return ok;
    }

    /** Carga los combos de la compañía; conserva planilla, proceso y concepto por nombre si existen. */
    async function cargarDependientesCompania(prefs) {
        prefs = prefs || {};
        const gen = generacionFiltros;
        const cia = valorValido(cboCia);
        const secundarias = Promise.all([
            cargarConceptos(cia, prefs.concepto)
        ]);
        const ok = await poblarSelect(`/api/selectores/planillas?cia=${encodeURIComponent(cia)}`, cboPlanilla);
        if (gen === generacionFiltros && ok && prefs.planilla && seleccionarPorTexto(cboPlanilla, prefs.planilla)) {
            await cargarProcesos(prefs.proceso);
        }
        await secundarias;
        return gen === generacionFiltros;
    }

    async function alCambiarCompania() {
        ++generacionFiltros;
        const prefs = {
            planilla: textoValido(cboPlanilla),
            proceso: textoValido(cboProceso),
            concepto: textoValido(cboConcepto)
        };
        resetSelect(cboProceso);
        resetSelect(cboPeriodo);
        if (!valorValido(cboCia)) {
            resetSelect(cboPlanilla);
            resetSelect(cboConcepto);
            return;
        }
        const vigente = await cargarDependientesCompania(prefs);
        if (vigente && filtrosPersist) filtrosPersist.guardar();
    }

    cboCia.addEventListener('change', alCambiarCompania);
    cboPlanilla.addEventListener('change', async function () {
        ++generacionFiltros;
        await cargarProcesos();
        if (filtrosPersist) filtrosPersist.guardar();
    });
    cboProceso.addEventListener('change', async function () {
        ++generacionFiltros;
        await cargarPeriodos();
        if (filtrosPersist) filtrosPersist.guardar();
    });

    document.getElementById('tbody-banbif').addEventListener('change', function (e) {
        if (e.target && e.target.classList && e.target.classList.contains('check-banbif')) {
            sincronizarCheckAllBan();
            actualizarContadoresBanbif();
        }
    });

    function nombreArchivoDesdeContentDisposition(header) {
        if (!header) return null;
        const m = /filename\*=UTF-8''([^;]+)|filename="?([^";]+)"?/i.exec(header);
        const raw = (m && (m[1] || m[2])) || '';
        try {
            return decodeURIComponent(raw.trim());
        } catch (e) {
            return raw.trim();
        }
    }

    async function generarTxtBanbif() {
        const seleccionados = obtenerSeleccionadosBanbif();
        if (!seleccionados.length) {
            alert('Seleccione al menos un trabajador.');
            return;
        }

        const cia = document.getElementById('cboCompania').value.trim();
        const payrolltype = document.getElementById('cboTipoPlanilla').value.trim();
        const processtype = document.getElementById('cboProceso').value.trim();
        const period = document.getElementById('cboPeriodo').value.trim();
        const currency = document.getElementById('cboMoneda').value.trim();
        const concept = document.getElementById('cboConcepto').value.trim();
        const paydate = document.getElementById('txtFechaPago').value.trim();
        const todosBancos = document.getElementById('chkTodosBancos').checked;

        if (!cia || !payrolltype || !processtype || !period || !concept) {
            alert('Complete compañía, tipo planilla, proceso, periodo y concepto.');
            return;
        }

        const btn = document.getElementById('btnGenerarTxt');
        btn.disabled = true;
        try {
            const res = await fetch(URL_GENERAR_TXT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    cia, payrolltype, processtype, period, currency, concept, paydate,
                    todos_bancos: todosBancos,
                    persons: seleccionados.map((r) => r.person)
                })
            });

            if (!res.ok) {
                let msg = 'Error al generar el archivo TXT.';
                try {
                    const payload = await res.json();
                    msg = payload.error || msg;
                    if (payload.campos_faltantes && payload.campos_faltantes.length) {
                        msg += '\n\nCampos pendientes:\n- ' + payload.campos_faltantes.join('\n- ');
                    }
                } catch (e) {
                    /* respuesta no JSON */
                }
                alert(msg);
                return;
            }

            const blob = await res.blob();
            const filename = nombreArchivoDesdeContentDisposition(res.headers.get('Content-Disposition'))
                || 'Banbif_periodo.txt';
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        } catch (e) {
            console.error(e);
            alert('Error de red o del servidor.');
        } finally {
            actualizarContadoresBanbif();
        }
    }

    document.getElementById('btnGenerarTxt').addEventListener('click', generarTxtBanbif);
    if (filtrosPersist) {
        filtrosPersist.registrarGuardadoEnCambio();
    }

    const companiasOk = await poblarSelect('/api/selectores/companias?filtro_usuario=1', cboCia);

    const guardadoObj = filtrosPersist ? filtrosPersist.leer() : null;
    const ciaGuardada = guardadoObj ? String(guardadoObj.cia || '').trim() : '';

    /* Bloquea compañía mientras se restaura la cascada guardada para que no se crucen cargas. */
    if (companiasOk) {
        cboCia.disabled = true;
        try {
            let restaurado = false;
            if (filtrosPersist && ciaGuardada) {
                restaurado = await filtrosPersist.aplicarRestauracionCascada({ poblarSelect });
            }
            if (!restaurado) {
                limpiarValorComboSiObsoleto(cboCia);
                if (!valorValido(cboCia)) {
                    seleccionarCompaniaInsensitive(cboCia, DEFAULT_CIA);
                }
                if (valorValido(cboCia)) {
                    await cargarDependientesCompania();
                }
            }
        } finally {
            cboCia.disabled = false;
        }
    }

    if (filtrosPersist && ciaGuardada) {
        if (
            valorValido(cboCia) && valorValido(cboPlanilla) && valorValido(cboProceso)
            && valorValido(cboPeriodo) && valorValido(cboConcepto)
        ) {
            await ejecutarListado();
        }
    }
});
</script>
{% endblock %}
