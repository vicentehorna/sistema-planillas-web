<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Receta médica</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 14mm 16mm 14mm 16mm;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            color: #1a1a2e;
            height: 100%;
        }
        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            line-height: 1.25;
        }
        .sheet {
            width: 100%;
            min-height: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 4px;
        }
        .doctor-name {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 20pt;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin: 0 0 2px 0;
            color: #111;
        }
        .doctor-title {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 11pt;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin: 0 0 2px 0;
            color: #111;
        }
        .doctor-cmp {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 10pt;
            font-weight: 700;
            letter-spacing: 0.6px;
            margin: 0 0 2px 0;
            color: #111;
        }
        .doctor-cmp:last-of-type {
            margin: 0 0 6px 0;
        }
        .contact {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 4px 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 9pt;
            color: #222;
            table-layout: fixed;
        }
        .labels col.col-left {
            width: 52%;
        }
        .labels col.col-right {
            width: 48%;
        }
        .contact td {
            padding: 0;
            vertical-align: middle;
        }
        .contact .mailwa {
            text-align: center;
            white-space: nowrap;
        }
        .wa-icon {
            height: 11px;
            width: 11px;
            vertical-align: -1px;
            margin: 0 3px 0 6px;
        }
        .rules {
            margin: 2px 0 8px 0;
            border-top: 2.5pt solid #111;
            border-bottom: 0.7pt solid #111;
            height: 4px;
        }
        .labels {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
            table-layout: fixed;
        }
        .labels td {
            padding: 0;
            vertical-align: top;
        }
        .label-rp {
            text-align: left;
            font-family: "Brush Script MT", "Segoe Script", "Comic Sans MS", cursive;
            font-size: 22pt;
            font-style: italic;
            line-height: 1;
            color: #111;
        }
        .label-ind {
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 14pt;
            font-style: italic;
            font-weight: 700;
            color: #111;
        }
        .body-content {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
            color: #111;
            margin-top: 1.2cm;
            min-height: 0;
        }
        .firma-block {
            margin-top: 8mm;
            text-align: right;
            page-break-inside: avoid;
        }
        .firma-img {
            height: 30mm;
            width: auto;
            max-width: 60mm;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="header">
            <p class="doctor-name">Vicente Horna Cortez</p>
            <p class="doctor-title">MÉDICO CIRUJANO</p>
            <p class="doctor-cmp">CMP 12708</p>
            <p class="doctor-cmp">CONSEJO REGIONAL III LIMA</p>
        </div>

        <table class="contact">
            <tr>
                <td class="mailwa">
                    E-mail: vicentehornac@gmail.com
                    <img class="wa-icon" src="{{ whatsapp_icon_src }}" alt="WhatsApp">
                    997894548
                </td>
            </tr>
        </table>

        <div class="rules"></div>

        <table class="labels">
            <colgroup>
                <col class="col-left">
                <col class="col-right">
            </colgroup>
            <tr>
                <td class="label-rp">Rp.</td>
                <td class="label-ind"></td>
            </tr>
        </table>

        <div class="body-content">{{ contenido }}</div>

        {% if firma_src %}
        <div class="firma-block">
            <img class="firma-img" src="{{ firma_src }}" alt="Firma">
        </div>
        {% endif %}
    </div>
</body>
</html>
